    <style>
        /* --- STYLE SPECIFIQUE Parcours (V34) --- */

        /* Layout specifique pour l'arbre */
        .neural-container {
            position: relative;
            padding: 20px 10px 100px 10px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* La ligne centrale (Le flux de donnees) */
        .neural-line {
            position: absolute; top: 0; bottom: 0; left: 50%; width: 4px;
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(-50%);
            z-index: 0;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        /* Effet de remplissage de la ligne selon la progression */
        .neural-line::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: var(--progression, 0%);
            background: var(--active-color, #38bdf8);
            box-shadow: 0 0 15px var(--active-color);
            transition: height 1s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Onglets de categories (Puces) */
        .chip-tabs {
            display: flex; gap: 10px; overflow-x: auto; padding: 10px 5px 20px 5px;
            margin-bottom: 20px;
            scrollbar-width: none; /* Firefox */
        }
        .chip-tabs::-webkit-scrollbar { display: none; }

        .chip-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px 18px; border-radius: 50px;
            color: #94a3b8; font-family: 'Russo One'; font-size: 0.75rem;
            white-space: nowrap; transition: 0.3s;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .chip-btn.active {
            background: rgba(15, 23, 42, 1);
            border-color: var(--chip-color);
            color: var(--chip-color);
            box-shadow: 0 0 15px var(--chip-glow);
            transform: translateY(-2px);
        }

        /* Les Modules (Nodes) */
        .module-card {
            position: relative; z-index: 2;
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; padding: 15px; margin-bottom: 30px;
            display: flex; align-items: center; gap: 15px;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Etat : Verrouille */
        .module-card.locked { opacity: 0.6; filter: grayscale(1); transform: scale(0.98); }

        /* Etat : Disponible (Pulsation) */
        .module-card.available { 
            border-color: rgba(255,255,255,0.4); 
            cursor: pointer;
            box-shadow: 0 0 0 rgba(255,255,255,0.1);
            animation: pulse-ready 2s infinite;
        }
        .module-card.available:active { transform: scale(0.95); }

        /* Etat : D?bloqu? (Activ?) */
        .module-card.unlocked {
            border-color: var(--active-color);
            background: linear-gradient(90deg, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.8) 100%);
            box-shadow: 0 0 20px var(--active-glow);
            transform: scale(1.02);
        }

        .module-icon {
            width: 50px; height: 50px; border-radius: 12px;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; color: #64748b; flex-shrink: 0;
        }
        .module-card.unlocked .module-icon {
            background: var(--active-bg); border-color: var(--active-color); color: #fff;
            box-shadow: inset 0 0 15px var(--active-glow);
        }
        .module-card.available .module-icon { color: #fff; border-color: #fff; }

        .module-info h3 { margin: 0; font-size: 0.9rem; color: #fff; margin-bottom: 4px; }
        .module-info p { margin: 0; font-size: 0.75rem; color: #94a3b8; line-height: 1.3; }

        .module-cost {
            position: absolute; top: -10px; right: 10px;
            background: #020617; border: 1px solid var(--gold); color: var(--gold);
            font-family: 'Russo One'; font-size: 0.7rem; padding: 4px 10px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        @keyframes pulse-ready {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.2); border-color: rgba(255,255,255,0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); border-color: rgba(255,255,255,0.8); }
            100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); border-color: rgba(255,255,255,0.4); }
        }

        /* HUD FLOTTANT (POINTS) */
        .points-floater {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(2, 6, 23, 0.95); border: 1px solid var(--gold);
            padding: 12px 25px; border-radius: 50px;
            display: flex; align-items: center; gap: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 20px rgba(126, 220, 255, 0.2);
            z-index: 900; width: max-content;
        }
        .points-val { font-family: 'Russo One'; font-size: 1.2rem; color: var(--gold); }
        .points-label { font-size: 0.7rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .constellation-panel { max-width:760px; margin:0 auto 18px; border:1px solid rgba(56,189,248,0.16); background:rgba(30,41,59,0.42); border-radius:12px; padding:14px; }
        .constellation-head { display:flex; justify-content:space-between; align-items:center; gap:10px; color:#fff; font-family:'Russo One'; font-size:0.82rem; margin-bottom:12px; }
        .constellation-grid { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:8px; }
        .constellation-card { border:1px solid color-mix(in srgb, var(--c) 44%, transparent); background:rgba(255,255,255,0.035); border-radius:8px; padding:10px; min-width:0; }
        .constellation-card i { color:var(--c); font-size:1.2rem; }
        .constellation-card strong { display:block; color:#fff; font-size:0.74rem; margin-top:6px; }
        .constellation-card span { display:block; color:#94a3b8; font-size:0.66rem; line-height:1.35; margin-top:4px; }
        @media (max-width: 760px) { .constellation-grid { grid-template-columns:1fr; } }

    </style>

    <script>
        // CONFIGURATION LOCALE
        const PATHS = [
            { id: 'force', name: 'FORCE', color: '#ef4444', icon: 'ri-hammer-fill' },     // Rouge
            { id: 'agility', name: 'AGILITE', color: '#38bdf8', icon: 'ri-windy-line' },  // Bleu Cyan
            { id: 'tech', name: 'TACTIQUE', color: '#a78bfa', icon: 'ri-cpu-line' },      // Violet
            { id: 'endurance', name: 'VITALITE', color: '#22c55e', icon: 'ri-heart-pulse-fill' } // Vert
        ];

        // Mapping Data.js -> Vue
        const PATH_MAPPING = { 
            'titan': 'force', 
            'spectre': 'agility', 
            'operator': 'tech',
            'juggernaut': 'endurance' 
        };

        let currentPath = 'force';
        let availablePoints = 0;
        let selectedTalentId = null;

        // 1. INITIALISATION SECURISEE
        document.addEventListener('DOMContentLoaded', () => {
            // On attend que state.js et data.js aient fait leur travail
            const initCheck = setInterval(() => {
                if(window.state && window.state.user && window.TALENT_TREE && Object.keys(window.TALENT_TREE).length > 0) {
                    clearInterval(initCheck);
                    renderTabs();
                    renderConstellationPanel();
                    refreshView();
                } else if (!window.TALENT_TREE) {
                    // Si data.js n'a pas encore charge les talents, on force un load si n?cessaire
                    if(window.loadServerData) window.loadServerData();
                }
            }, 200);

            // Timeout de securite (5s) pour afficher un message si ca bug
            setTimeout(() => {
                clearInterval(initCheck);
                if(!window.TALENT_TREE || Object.keys(window.TALENT_TREE).length === 0) {
                    document.getElementById('tree-render').innerHTML = `
                        <div style="color: var(--danger); text-align:center; padding:20px;">
                            <i class="ri-error-warning-fill" style="font-size:2rem;"></i><br>
                            ECHEC CONNECTION BASE DE DONNEES<br>
                            <span style="font-size:0.7rem; color:#94a3b8;">Verifie ta connexion internet et recharge.</span>
                        </div>
                    `;
                }
            }, 5000);
        });

        // 2. RENDU DES ONGLETS (CHIPS)
        function renderTabs() {
            const container = document.getElementById('nav-tabs');
            container.innerHTML = PATHS.map(p => `
                <button class="chip-btn ${p.id === currentPath ? 'active' : ''}" 
                    style="--chip-color: ${p.color}; --chip-glow: ${p.color}66;"
                    onclick="switchPath('${p.id}')">
                    <i class="${p.icon}"></i> ${p.name}
                </button>
            `).join('');
        }

        function renderConstellationPanel() {
            const target = document.getElementById('constellation-panel');
            if(!target) return;
            const list = window.TITAN_TALENT_CONSTELLATIONS || [];
            target.innerHTML = `
                <div class="constellation-head">
                    <span><i class="ri-node-tree"></i> CONSTELLATIONS V2</span>
                    <span style="color:#94a3b8; font-size:0.68rem;">Effets critiques bornes cote serveur</span>
                </div>
                <div class="constellation-grid">
                    ${list.map(item => `
                        <div class="constellation-card" style="--c:${item.theme}">
                            <i class="${item.icon}"></i>
                            <strong>${escapeTalentText(item.label)}</strong>
                            <span>${escapeTalentText((item.examples || []).slice(0, 2).join(' / '))}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        function escapeTalentText(value) {
            if (window.titanEscapeText) return window.titanEscapeText(value);
            return String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function switchPath(id) {
            currentPath = id;
            renderTabs();
            refreshView();
        }

        // 3. LOGIQUE PRINCIPALE DE RENDU
        function refreshView() {
            const u = window.state.user;
            const container = document.getElementById('tree-render');

            // Calcul des points
            // Note: On assume niveau 1 = 0 pts, niveau 2 = 1 pt.
            const totalPointsEarned = Math.max(0, (u.level || 1) - 1);

            // Calcul des points depenses
            let spentPoints = 0;
            if (u.unlockedTalents && Array.isArray(u.unlockedTalents)) {
                u.unlockedTalents.forEach(tId => {
                    if (window.TALENT_TREE[tId]) spentPoints += window.TALENT_TREE[tId].cost;
                });
            }

            availablePoints = totalPointsEarned - spentPoints;
            document.getElementById('points-display').innerText = availablePoints;

            // Filtrage des talents de la voie actuelle
            const talents = Object.values(window.TALENT_TREE)
                .filter(t => (t.path && PATH_MAPPING[t.path] === currentPath) || t.path === currentPath)
                .sort((a,b) => a.cost - b.cost); // On trie par cout (progression logique)

            if (talents.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px; color:#64748b;">Aucun module detecte sur ce canal.</div>`;
                return;
            }

            // Configuration de la couleur active
            const pathInfo = PATHS.find(p => p.id === currentPath);
            const activeColor = pathInfo ? pathInfo.color : '#38bdf8';
            document.documentElement.style.setProperty('--active-color', activeColor);

            // Rendu de la liste
            let unlockedCount = 0;

            container.innerHTML = talents.map((t, index) => {
                const isUnlocked = (u.unlockedTalents || []).includes(t.id);
                // Est disponible si : Pas debloque ET (Pas de prerequis OU prerequis debloque)
                const isAvailable = !isUnlocked && (!t.prev || (u.unlockedTalents || []).includes(t.prev));

                if (isUnlocked) unlockedCount++;

                let cssClass = 'locked';
                let clickAction = '';

                if (isUnlocked) {
                    cssClass = 'unlocked';
                } else if (isAvailable) {
                    cssClass = 'available';
                    clickAction = `onclick="openPurchaseModal('${t.id}')"`;
                }

                return `
                    <div class="module-card ${cssClass}" ${clickAction}
                         style="--active-color: ${activeColor}; --active-glow: ${activeColor}44; --active-bg: ${activeColor}22;">

                        <div class="module-icon">
                            <i class="${isUnlocked ? 'ri-checkbox-circle-fill' : t.icon}"></i>
                        </div>

                        <div class="module-info">
                            <h3>${t.name}</h3>
                            <p>${t.desc}</p>
                            ${t.bonus ? `<div style="color:${activeColor}; font-size:0.7rem; font-weight:bold; margin-top:4px;">+${t.bonus} ${t.stat || 'STAT'}</div>` : ''}
                        </div>

                        ${!isUnlocked ? `<div class="module-cost">${t.cost} PT</div>` : ''}
                    </div>
                `;
            }).join('');

            // Mise ? jour de la ligne de progression (visuel)
            const progressPercent = (unlockedCount / talents.length) * 100;
            const line = document.getElementById('neural-line');
            line.style.setProperty('--progression', `${progressPercent}%`);
            line.style.setProperty('--active-color', activeColor);
        }

        // 4. GESTION DES MODALES
        function openPurchaseModal(tId) {
            selectedTalentId = tId;
            const t = window.TALENT_TREE[tId];
            const pathInfo = PATHS.find(p => p.id === currentPath);

            document.getElementById('m-title').innerText = t.name;
            document.getElementById('m-desc').innerText = t.desc;
            document.getElementById('m-cost').innerText = t.cost + " PTS";
            document.getElementById('m-icon').className = t.icon;

            // Styling contextuel
            const iconBox = document.getElementById('m-icon-box');
            iconBox.style.color = pathInfo.color;
            iconBox.style.borderColor = pathInfo.color;
            iconBox.style.background = pathInfo.color + "22"; // Hex opacity

            const btn = document.getElementById('m-btn');
            btn.style.background = pathInfo.color;
            btn.innerText = "Débloquer cette étape";

            if (availablePoints < t.cost) {
                btn.disabled = true;
                btn.style.background = "#334155";
                btn.style.color = "#94a3b8";
                btn.innerText = `POINTS INSUFFISANTS (Manque ${t.cost - availablePoints})`;
            } else {
                btn.disabled = false;
                btn.style.color = "#000";
            }

            document.getElementById('talent-modal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        function openRules() { document.getElementById('rules-modal').classList.add('active'); }

        // 5. ACTION DE DEBLOCAGE
        async function confirmUnlock() {
            if (!selectedTalentId) return;

            const t = window.TALENT_TREE[selectedTalentId];
            if (availablePoints < t.cost) return; // Securite double

            const btn = document.getElementById('m-btn');
            btn.innerHTML = `<i class="ri-loader-4-line ri-spin"></i> INSTALLATION...`;

            try {
                // 1. Update LOCAL (Immediat pour l'UX)
                if (!window.state.user.unlockedTalents) window.state.user.unlockedTalents = [];
                window.state.user.unlockedTalents.push(selectedTalentId);

                // Sauvegarde State Local
                window.saveState(); 

                // 2. Sync CLOUD (Si connect?)
                if (window.titanClient && window.state.user.id && !window.state.user.id.startsWith('guest_')) {
                    const updater = window.safeProfileUpdate || ((payload, id) => window.titanClient.from('profiles').update(payload).eq('id', id).then(({ error }) => error));
                    const error = await updater({
                        unlocked_talents: window.state.user.unlockedTalents,
                        game_state: window.state
                    }, window.state.user.id);
                    if(error) console.error("Erreur Sync Talent:", error);
                }

                // 3. Feedback Visuel
                closeModal('talent-modal');
                refreshView();

                // Petit effet de vibration si support?
                if (navigator.vibrate) navigator.vibrate(50);

            } catch (e) {
                console.error(e);
                if(window.showNotification) window.showNotification('error', 'TALENTS', 'Erreur systeme lors de l installation du module.'); else console.error('[TALENTS]', e);
                refreshView(); // Rollback visuel si crash
            }
        }

    </script>
