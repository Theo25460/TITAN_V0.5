<html lang="fr" class="asc-root">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <title>Nouveau mot de passe — TITAN</title>
    <meta name="description" content="Choisis un nouveau mot de passe pour ton compte TITAN." />
    <meta name="robots" content="noindex,nofollow" />
    <link rel="canonical" href="https://titan-app.fr/update-password" />
    <meta name="theme-color" content="#05070a" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />

  </head>
  <body class="asc auth-page">
    <a class="asc-skip" href="#contenu">Aller au contenu</a>
    <main class="auth-layout" id="contenu">
      <section class="auth-side" aria-hidden="true">
        <a class="asc-brand auth-brand" href="/"><span data-mark></span>TITAN</a>
        <div class="auth-pitch"><p class="asc-eyebrow cy">Compte</p><p class="auth-pitch-title">Un nouveau mot de passe, et tu reprends où tu en étais.</p></div>
      </section>
      <section class="auth-card" aria-labelledby="pw-title">
        <a class="asc-brand auth-brand-mobile" href="/"><span data-mark></span>TITAN</a>
        <h1 id="pw-title">Nouveau mot de passe</h1>
        <form id="pw-form" class="asc-stack" novalidate>
          <label class="asc-field"><span>Nouveau mot de passe</span><span class="auth-pass"><input class="asc-input" id="pw" name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="asc-btn asc-btn-ghost asc-btn-icon" data-reveal aria-label="Afficher le mot de passe"></button></span><small>8 caractères minimum. Une phrase courte est plus sûre qu’un mot compliqué.</small></label>
          <label class="asc-field"><span>Confirme-le</span><input class="asc-input" id="pw2" name="confirm" type="password" autocomplete="new-password" minlength="8" required></label>
          <p class="auth-msg" id="pw-msg" role="alert" hidden></p>
          <button type="submit" class="asc-btn asc-btn-primary" id="pw-save">Enregistrer</button>
        </form>
        <nav class="auth-legal" aria-label="Informations"><a href="/login">Connexion</a><a href="/service">Aide</a></nav>
      </section>
    </main>
    <script src="/js/vendor/supabase-2.111.0.js"></script>
