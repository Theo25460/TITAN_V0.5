<body data-page="update-password">

    <main class="container">
        <h1>Choisis un nouveau mot de passe</h1>
        <input type="password" id="new_password" placeholder="Entrez le nouveau mot de passe" aria-label="Nouveau mot de passe">
        <button id="save-btn" onclick="runUpdate()">ENREGISTRER</button>
        <div id="status"></div>
    </main>

    <script>
        // CONFIGURATION
        const SB_URL = window.TITAN_SUPABASE_URL;
        const SB_KEY = window.TITAN_SUPABASE_ANON_KEY;

        // CORRECTION : J'utilise 'titanClient' au lieu de 'supabase' pour eviter le conflit de nom
        let titanClient = null;

        function getTitanClient() {
            if (titanClient) return titanClient;
            if (typeof window.initTitanSupabaseClient === 'function') {
                titanClient = window.initTitanSupabaseClient();
                if (titanClient) return titanClient;
            }
            if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
            titanClient = window.supabase.createClient(SB_URL, SB_KEY, window.TITAN_SUPABASE_CLIENT_OPTIONS);
            return titanClient;
        }

        // Fonction appelee par le bouton
        async function runUpdate() {
            const btn = document.getElementById("save-btn");
            const status = document.getElementById("status");
            const pwd = document.getElementById("new_password").value;

            if (!pwd) {
                status.innerText = "Le mot de passe est vide.";
                status.style.color = "#ef4444";
                return;
            }

            btn.innerText = "ENVOI...";
            btn.disabled = true;

            try {
                // Utilisation du client renomm? 'titanClient'
                const client = getTitanClient();
                if (!client) throw new Error("Serveur d'authentification indisponible. Verifiez votre connexion puis reessayez.");

                const { data, error } = await client.auth.updateUser({ 
                    password: pwd 
                });

                if (error) throw error;

                status.innerText = "Succes ! Redirection...";
                status.style.color = "#4ade80";

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 2000);

            } catch (err) {
                console.error(err);
                status.innerText = "Erreur : " + err.message;
                status.style.color = "#ef4444";
                btn.innerText = "REESSAYER";
                btn.disabled = false;
            }
        }
        // Verifie que le lien de reinitialisation a bien ouvert une session Supabase.
        getTitanClient()?.auth.getSession().then(({ data }) => {
            if(!data.session) {
                console.warn("Pas de session active. Le lien est peut-etre expire.");
                document.getElementById("status").innerText = "Lien invalide ou expire.";
                document.getElementById("status").style.color = "#9ee7ff";
            }
        });
    </script>
