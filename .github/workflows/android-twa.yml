name: Android (TWA)

# Builds the signed Android App Bundle that wraps https://titan-app.fr (Trusted Web Activity).
# Manual only. Needs the repository secrets described in docs/ANDROID.md:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (entier croissant)"
        required: true
        default: "300"
      version_name:
        description: "versionName"
        required: true
        default: "300.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bubblewrap
        run: npm install --global @bubblewrap/cli@1.23.0
      - name: Projet Android depuis android/twa-manifest.json
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "Secret ANDROID_KEYSTORE_BASE64 manquant (voir docs/ANDROID.md)"; exit 1; }
          echo "$KEYSTORE_B64" | base64 --decode > android.keystore
          node -e "const f='twa-manifest.json';const m=require('./'+f);m.appVersionCode=Number('${{ inputs.version_code }}');m.appVersionName=m.appVersion='${{ inputs.version_name }}';require('fs').writeFileSync(f,JSON.stringify(m,null,2))"
          mkdir -p ~/.bubblewrap && printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_SDK_ROOT" > ~/.bubblewrap/config.json
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
      - name: Construire et signer
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: titan-android-${{ inputs.version_name }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          if-no-files-found: error
