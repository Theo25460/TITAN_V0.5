name: Qualite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "claude/titan-finition-web", "codex/v11-finalization-20261102"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et build public
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot (historique complet pour la recherche de secrets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile

      - name: Verifier, tester et construire
        run: pnpm run verify

      # The built dist/ (the one archived below) served with the real netlify.toml rules and compared with the production reference
      # (tools/seo/baseline/production.json): P0, or a P1 without its approval in tools/seo/approvals.json, fails the check. About 1 s.
      - name: Bouclier SEO sur l'artefact construit
        run: node tools/seo-guard.mjs check --dist dist --context production

      - name: Rechercher des secrets dans tout l'historique git
        run: pnpm run history-scan

      - name: Archiver le site vérifié sans déploiement
        uses: actions/upload-artifact@v4
        with:
          name: titan-public-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Archiver le rapport du bouclier SEO
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: seo-guard-${{ github.sha }}
          path: test-results/seo-guard/
          retention-days: 14
          if-no-files-found: ignore

  e2e:
    name: Parcours navigateur (Playwright)
    runs-on: ubuntu-24.04
    # 1 093 journeys run one at a time (24.4 min on 18 Nov 2026, the consolidated release added journeys): room to grow without a silent cut.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: pnpm run test:e2e

  # The Netlify Deploy Preview of the EXACT head commit of the pull request (build-info.json names it), checked as Google would read it:
  # statuses and redirects on the real platform, X-Robots-Tag: noindex everywhere, canonicals and sitemap on titan-app.fr only. Read-only,
  # no secret. Waits at most 8 minutes for Netlify; a preview that never shows the commit is reported INCONCLUSIVE (warning), not green.
  # Drift review (P1 approvals) is the artifact check's job above: here only P0 fails.
  seo-preview:
    name: Bouclier SEO sur la Deploy Preview
    if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Attendre la preview du commit testé, puis la contrôler
        env:
          PREVIEW: https://deploy-preview-${{ github.event.pull_request.number }}--titano-app.netlify.app
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          node tools/seo-guard.mjs check --base "$PREVIEW" --context deploy-preview --expect-commit "$HEAD_SHA" --wait-commit 480 --fail-on p0
          code=$?
          if [ "$code" = 3 ]; then echo "::warning title=Preview SEO non concluante::$PREVIEW n'a pas servi $HEAD_SHA à temps (preview désactivée, build Netlify en échec ou en attente). Le contrôle de l'artefact reste la garantie bloquante."; exit 0; fi
          exit $code
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: seo-preview-${{ github.event.pull_request.head.sha }}
          path: test-results/seo-guard/
          retention-days: 14
          if-no-files-found: ignore

  database:
    name: Migrations sur une replique vide (Postgres 17.6)
    runs-on: ubuntu-24.04
    container:
      image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    env:
      PGBIN: /usr/lib/postgresql/17/bin
      TITAN_EXPECT_PG_VERSION_NUM: '170006'
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python pour les contrats concurrents
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Rejouer les migrations en attente et les tests SQL
        run: bash tools/db/test-migrations.sh
      - name: Verifier le bundle historique et ses migrations correctives
        if: ${{ !cancelled() }}
        run: env RELEASE_SQL=supabase/release-300.sql bash tools/db/test-migrations.sh
