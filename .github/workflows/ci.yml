name: Qualite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests et build public
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le depot (historique complet pour la recherche de secrets)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile

      - name: Verifier, tester et construire
        run: pnpm run verify

      - name: Rechercher des secrets dans tout l'historique git
        run: pnpm run history-scan

  e2e:
    name: Parcours navigateur (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dependances verrouillees
        run: pnpm install --frozen-lockfile
      - name: Installer Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Parcours de bout en bout
        run: pnpm run test:e2e

  database:
    name: Migrations sur une replique vide (Postgres 17.6)
    runs-on: ubuntu-24.04
    container:
      image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    env:
      PGBIN: /usr/lib/postgresql/17/bin
      TITAN_EXPECT_PG_VERSION_NUM: '170006'
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Python pour les contrats concurrents
        run: apt-get update && apt-get install -y --no-install-recommends python3
      - name: Rejouer les migrations en attente et les tests SQL
        run: bash tools/db/test-migrations.sh
      - name: Verifier le bundle historique et ses migrations correctives
        if: ${{ !cancelled() }}
        run: env RELEASE_SQL=supabase/release-300.sql bash tools/db/test-migrations.sh
