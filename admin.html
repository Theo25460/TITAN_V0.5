<body class="admin-body" data-page="admin">
    <div id="admin-gate" class="admin-gate" role="status" aria-live="polite">
        <div class="gate-panel">
            <img src="./image/logo.png" alt="" class="gate-logo">
            <div>
                <p class="gate-kicker">TITAN OS</p>
                <p class="gate-title">Centre de controle</p>
                <p id="gate-message">Verification de l'acces administrateur...</p>
            </div>
        </div>
    </div>

    <div id="admin-app" class="admin-app" hidden>
        <aside class="admin-sidebar" aria-label="Navigation admin">
            <a aria-label='Retour accueil TITAN OS' class='admin-brand' href='/'>
                <img src="./image/logo.png" alt="">
                <span>
                    <strong>TITAN OS</strong>
                    <small>Control Center</small>
                </span>
            </a>
            <nav id="admin-nav" class="admin-nav"></nav>
            <div class="admin-sidebar-foot">
                <span id="admin-role-badge" class="status-badge badge-premium">admin</span>
                <button id="admin-signout" class="icon-button" type="button" title="Deconnexion">
                    <i class="ri-logout-box-r-line" aria-hidden="true"></i>
                </button>
            </div>
        </aside>

        <main class="admin-main">
            <header class="admin-topbar">
                <button id="admin-menu-toggle" class="icon-button menu-toggle" type="button" title="Menu">
                    <i class="ri-menu-2-line" aria-hidden="true"></i>
                </button>
                <div class="admin-title-block">
                    <span id="admin-current-path">/admin/dashboard</span>
                    <h1 id="admin-page-title">Dashboard</h1>
                </div>
                <div class="admin-top-actions">
                    <span id="admin-sync-state" class="sync-pill">connecte</span>
                    <button id="admin-refresh" class="admin-btn secondary" type="button">
                        <i class="ri-refresh-line" aria-hidden="true"></i>
                        <span>Rafraichir</span>
                    </button>
                </div>
            </header>

            <section id="admin-alerts" class="admin-alerts" aria-live="polite"></section>
            <section id="admin-view" class="admin-view"></section>
        </main>
    </div>

    <div id="admin-modal" class="admin-modal" hidden>
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <div class="modal-head">
                <div>
                    <span id="modal-kicker">TITAN OS</span>
                    <h2 id="modal-title">Action</h2>
                </div>
                <button id="modal-close" class="icon-button" type="button" title="Fermer">

                </button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-actions" class="modal-actions"></div>
        </div>
    </div>
