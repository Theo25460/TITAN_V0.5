# Séance hors ligne, conservation après fermeture de l'application, envoi unique au retour du réseau
appId: fr.titanapp.app
---
- launchApp
- runFlow:
    when:
        visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: "tab-record"
    timeout: 30000
- setAirplaneMode: enabled
- tapOn:
    id: "tab-record"
- extendedWaitUntil:
    visible:
      id: "offline-banner"
    timeout: 20000
- scrollUntilVisible:
    element:
      id: "sport-yoga"
    direction: DOWN
- tapOn:
    id: "sport-yoga"
- waitForAnimationToEnd
- tapOn:
    id: "duration-m"
- tapOn:
    id: "duration-m"
- inputText: "20"
- scrollUntilVisible:
    element:
      id: "session-note"
    direction: DOWN
# Typing through adb sometimes lands before the field has focus (seen on CI: the text never appeared). Retry the whole entry, and prove the text
# really reached the field before saving: the server check later expects exactly this note, once.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: "session-note"
      - waitForAnimationToEnd
      - eraseText
      - inputText: "E2E hors ligne"
      - assertVisible: ".*E2E hors ligne.*"
- takeScreenshot: 16a-note-saisie
# The form now carries the sport-specific optional metrics: bring the save button into view before tapping it.
# No hideKeyboard: on Android it sends BACK when the keyboard is already closed, which would leave the form (flaky). While typing, the footer
# joins the end of the scrolled content, so scrolling reaches it.
- scrollUntilVisible:
    element:
      id: "session-save"
    direction: DOWN
    timeout: 30000
    visibilityPercentage: 100
- tapOn:
    id: "session-save"
- extendedWaitUntil:
    visible: "Gardée sur ce téléphone"
    timeout: 30000
- takeScreenshot: 16-hors-ligne-garde
- tapOn:
    id: "result-done"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: ".*en attente d’envoi.*"
    timeout: 30000
- takeScreenshot: 17-relance-en-attente
- setAirplaneMode: disabled
- extendedWaitUntil:
    notVisible: ".*en attente d’envoi.*"
    timeout: 90000
- takeScreenshot: 18-synchronise
