# Déconnexion et changement de compte sans fuite de données
appId: fr.titanapp.app
---
# Check the server's actual decision; no test enables the flag.
- runFlow:
    when:
      true: ${LIVE_FOR_A == 't'}
    file: ../live/session.yaml
- launchApp
- runFlow:
    when:
        visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: "tab-profile"
    timeout: 30000
- tapOn:
    id: "tab-profile"
- takeScreenshot: 19-profil
- scrollUntilVisible:
    element: "Mon identité"
    direction: DOWN
- tapOn: "Mon identité"
- scrollUntilVisible:
    element: "Mon Atelier.*"
    direction: DOWN
- tapOn: "Mon Atelier.*"
- scrollUntilVisible:
    element:
      id: "atelier-preview-cos_frame_neon"
    direction: DOWN
- tapOn:
    id: "atelier-preview-cos_frame_neon"
- assertVisible: "Encore .* crédits à gagner en séance."
- takeScreenshot: 19a-apercu-atelier
- back
- back
- scrollUntilVisible:
    element: "Connexions & compte"
    direction: DOWN
- tapOn: "Connexions & compte"
- scrollUntilVisible:
    element: "Confidentialité"
    direction: DOWN
- tapOn: "Confidentialité"
- extendedWaitUntil:
    visible:
      id: "privacy-publicProfile"
    timeout: 20000
- tapOn:
    id: "privacy-publicProfile"
- takeScreenshot: 19b-confidentialite
- back
- scrollUntilVisible:
    element:
      id: "logout"
    direction: DOWN
- tapOn:
    id: "logout"
- tapOn: "(?i)se déconnecter"
- extendedWaitUntil:
    visible:
      id: "welcome-login"
    timeout: 20000
- tapOn:
    id: "welcome-login"
- tapOn:
    id: "login-email"
- inputText: "e2e-b@titan.test"
- tapOn:
    id: "login-password"
- inputText: "TitanE2E-b-2026"
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "onboarding-next"
    timeout: 30000
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-next"
- tapOn:
    id: "onboarding-later"
- extendedWaitUntil:
    visible: ".*Athlete B.*"
    timeout: 20000
- assertVisible: "Ta première séance"
- assertNotVisible: ".*Athlete A.*"
- tapOn:
    id: "tab-progress"
- assertVisible: "Tes statistiques commencent ici"
- takeScreenshot: 20-compte-b-vide
