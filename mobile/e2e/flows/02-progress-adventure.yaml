# Statistiques, journal, campagne de l'Aventure et validation d'un chapitre côté serveur
appId: fr.titanapp.app
---
- launchApp
- runFlow:
    when:
        visible: ".*isn't responding.*"
    commands:
      - tapOn: "Wait"
- extendedWaitUntil:
    visible:
      id: "tab-progress"
    timeout: 30000
- tapOn:
    id: "tab-progress"
- extendedWaitUntil:
    visible: "Cette semaine"
    timeout: 20000
- takeScreenshot: 08-progres-semaine
- tapOn: "Tendances"
- takeScreenshot: 09-progres-tendances
- tapOn: "Maîtrise"
- takeScreenshot: 10-progres-maitrise
- tapOn: "Journal"
- assertVisible: ".*Course à pied.*10 km.*"
- takeScreenshot: 11-journal
- back
- tapOn:
    id: "tab-adventure"
- extendedWaitUntil:
    visible:
      id: "world-aube"
    timeout: 20000
- takeScreenshot: 12-aventure
- tapOn:
    id: "world-aube"
- scrollUntilVisible:
    element:
      id: "world-start"
    direction: DOWN
    timeout: 45000
- tapOn:
    id: "world-start"
- scrollUntilVisible:
    element: "Chapitre 1/9.*"
    direction: UP
    timeout: 20000
- takeScreenshot: 13-campagne-chapitre-1
- back
- tapOn:
    id: "tab-record"
- takeScreenshot: 13b-seance-acces-direct
- tapOn:
    id: "sport-running"
- tapOn:
    id: "distance"
- inputText: "5"
- waitForAnimationToEnd
- tapOn:
    id: "duration-m"
- tapOn:
    id: "duration-m"
- inputText: "30"
- tapOn:
    id: "session-save"
- extendedWaitUntil:
    visible: ".*(XP confirmés|Récompense en vérification).*"
    timeout: 30000
- tapOn:
    id: "result-done"
- tapOn:
    id: "tab-adventure"
- tapOn:
    id: "world-aube"
# On smaller viewports the chapter action sits below its objectives.
- scrollUntilVisible:
    element:
      id: "world-claim"
    direction: DOWN
    timeout: 45000
- takeScreenshot: 14-chapitre-pret
- tapOn:
    id: "world-claim"
- extendedWaitUntil:
    visible: "Insigne obtenu"
    timeout: 20000
- takeScreenshot: 15-insigne-revele
- tapOn: "Continuer l’aventure"
- scrollUntilVisible:
    element: "Chapitre 2/9.*"
    direction: UP
    timeout: 30000
- takeScreenshot: 15b-chapitre-valide
- back
