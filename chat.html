    <style>
        /* --- CSS SPECIFIQUE CHAT AVANCE --- */
        .chat-interface { display: grid; grid-template-columns: 320px 1fr; gap: 20px; height: calc(100vh - 140px); min-height: 650px; }
        .contact-panel { background: rgba(30, 37, 56, 0.8); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; }
        .cp-header { padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(0,0,0,0.2); }
        .search-bar { position: relative; }
        .search-bar input { width: 100%; padding: 12px 15px 12px 40px; background: #131824; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-family: 'Outfit'; transition: 0.3s; }
        .friend-code-add { display:flex; gap:8px; padding:0 15px 15px; }
        .friend-code-add input { min-width:0; flex:1; padding:10px; border-radius:8px; border:1px solid rgba(56,189,248,0.28); background:#06070A; color:#fff; font-family:'Courier New', monospace; text-transform:uppercase; }
        .friend-code-add button { width:42px; border-radius:8px; border:0; background:var(--accent); color:#020617; cursor:pointer; }
        .msg-report-btn { margin-left:8px; border:0; background:transparent; color:#64748b; cursor:pointer; padding:2px; line-height:1; }
        .msg-report-btn:hover { color:#ef4444; }
        .search-bar input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(251, 146, 60, 0.1); }
        .search-bar i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .contact-list { flex: 1; overflow-y: auto; padding: 10px; }
        .contact-card { display: flex; align-items: center; gap: 15px; padding: 15px; border-radius: 12px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; margin-bottom: 5px; }
        .contact-card { width: 100%; text-align: left; background: transparent; }
        .contact-card:hover { background: rgba(255,255,255,0.03); }
        .contact-card.active { background: linear-gradient(90deg, rgba(251, 146, 60, 0.1), transparent); border-left: 3px solid var(--primary); }
        .contact-card.locked { opacity: 0.62; }
        .c-avatar { position: relative; width: 50px; height: 50px; }
        .c-img { width: 100%; height: 100%; border-radius: 14px; background: #131824; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); }
        .c-status { position: absolute; bottom: -2px; right: -2px; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #1e2538; }
        .status-online { background: var(--success); box-shadow: 0 0 10px var(--success); } .status-busy { background: var(--danger); } .status-offline { background: var(--text-muted); }
        .c-info { flex: 1; min-width: 0; }
        .c-name { font-weight: 700; color: #fff; font-size: 0.95rem; margin-bottom: 3px; }
        .c-last { font-size: 0.75rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .c-time { font-size: 0.65rem; color: var(--text-muted); opacity: 0.7; }
        .chat-area { background: #1e2538; border-radius: 24px; display: flex; flex-direction: column; overflow: hidden; position: relative; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        .chat-header { padding: 15px 25px; background: rgba(19, 24, 36, 0.95); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .ch-user { display: flex; align-items: center; gap: 15px; }
        .ch-name { font-family: 'Russo One'; font-size: 1.1rem; letter-spacing: 1px; }
        .ch-status { font-size: 0.75rem; color: var(--success); display: flex; align-items: center; gap: 5px; }
        .ch-actions button { background: transparent; border: none; color: var(--text-muted); font-size: 1.4rem; cursor: pointer; padding: 8px; border-radius: 8px; transition: 0.2s; }
        .ch-actions button:hover { background: rgba(239, 68, 68, 0.1); color: var(--danger); }
        .chat-feed { flex: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; background: radial-gradient(circle at center, #1e2538 0%, #131824 100%); }
        .chat-date-sep { text-align: center; font-size: 0.7rem; color: var(--text-muted); opacity: 0.5; margin: 10px 0; position: relative; }
        .chat-date-sep::before, .chat-date-sep::after { content: ''; position: absolute; top: 50%; width: 30%; height: 1px; background: rgba(255,255,255,0.1); }
        .chat-date-sep::before { left: 0; } .chat-date-sep::after { right: 0; }
        .msg-group { display: flex; flex-direction: column; gap: 2px; max-width: 75%; }
        .msg-group.mine { align-self: flex-end; align-items: flex-end; }
        .msg-group.theirs { align-self: flex-start; align-items: flex-start; }
        .msg-bubble { padding: 12px 18px; font-size: 0.9rem; line-height: 1.5; position: relative; word-wrap: break-word; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .mine .msg-bubble { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #000; font-weight: 600; border-radius: 18px 18px 4px 18px; }
        .theirs .msg-bubble { background: #2d364f; color: #e2e8f0; border-radius: 18px 18px 18px 4px; border: 1px solid rgba(255,255,255,0.05); }
        .msg-meta { font-size: 0.65rem; opacity: 0.6; margin-top: 4px; display: flex; gap: 5px; align-items: center; }
        .msg-author { font-size:0.62rem; color:var(--primary); font-weight:800; margin-bottom:3px; text-transform:uppercase; }
        .mine .msg-author { color:#06070A; }
        .msg-chip { display:inline-flex; margin-left:6px; padding:2px 5px; border-radius:999px; background:rgba(255,255,255,0.16); font-size:0.55rem; }
        .chat-input-zone { padding: 20px; background: #131824; border-top: 1px solid rgba(255,255,255,0.05); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 15px; align-items: end; }
        .chat-economy-hint { grid-column:1 / -1; color:#9fb0c7; font-size:0.72rem; font-weight:800; display:flex; align-items:center; gap:6px; }
        .c-input-wrapper { flex: 1; background: rgba(30, 37, 56, 0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 10px; display: flex; align-items: center; }
        .c-input { width: 100%; background: transparent; border: none; color: #fff; font-family: 'Outfit'; font-size: 0.95rem; resize: none; height: 24px; max-height: 100px; padding: 0 10px; }
        .c-btn-send { width: 50px; height: 50px; border-radius: 14px; border: none; background: var(--primary); color: #000; font-size: 1.5rem; cursor: pointer; transition: 0.2s; box-shadow: 0 0 15px rgba(251, 146, 60, 0.2); }
        .c-btn-send:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(251, 146, 60, 0.4); }
        .empty-chat { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); text-align: center; }
        .empty-icon { font-size: 5rem; opacity: 0.1; margin-bottom: 20px; }
        .briefing-card { max-width:640px; margin:auto; border:1px solid rgba(255,255,255,0.08); background:rgba(255,255,255,0.035); border-radius:16px; padding:26px; color:#cbd5e1; line-height:1.65; }
        .briefing-card i { font-size:2rem; color:var(--accent); }
        .briefing-card h2 { color:#fff; font-family:'Russo One'; margin:10px 0; }
        .chat-feed::-webkit-scrollbar { width: 4px; } .chat-feed::-webkit-scrollbar-track { background: transparent; } .chat-feed::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 4px; }
        @media (max-width: 860px) {
            .chat-interface { grid-template-columns: 1fr; height: auto; min-height: 0; gap: 12px; }
            .contact-panel { max-height: 230px; border-radius: 12px; }
            .contact-list { display: grid; grid-template-columns: 1fr; max-height: 158px; }
            .contact-card { padding: 10px; gap: 10px; }
            .c-avatar { width: 42px; height: 42px; }
            .chat-area { min-height: 62vh; border-radius: 12px; }
            .chat-header { padding: 12px; }
            .chat-feed { padding: 14px; }
            .msg-group { max-width: 88%; }
            .chat-input-zone { padding: 12px; gap: 8px 10px; }
            .c-btn-send { width: 46px; height: 46px; border-radius: 10px; }
        }
    </style>

<body data-page="chat">
    <div class="layout">
        <nav class="sidebar"></nav> 
        <main class="main-content">
            <div class="mobile-user-bar">
    <div style="display:flex; align-items:center; justify-content:space-between; width:100%; background:rgba(255,255,255,0.05); padding:15px; border-radius:16px; border:1px solid rgba(255,255,255,0.1); margin-bottom:20px;">
        <div style="display:flex; align-items:center; gap:12px;" onclick="window.location.href='profile.html'">
            <div style="width:40px; height:40px; background:var(--bg-panel); border-radius:50%; border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; color:var(--accent);"><i class="ri-user-3-fill"></i></div>
            <div>
                <div style="font-weight:800; font-size:1rem; color:#fff;" id="mobileName">Athlete</div>
                <div style="font-size:0.75rem; color:var(--text-muted);">Niv. <span id="mobileLvl">1</span></div>
            </div>
        </div>
        <div style="text-align:right;">
            <div style="font-weight:800; color:var(--gold); font-size:1rem;"><span id="mobileCredits">0</span> $</div>
            <div style="font-size:0.7rem; color:var(--text-muted); text-transform:uppercase;">Credits</div>
        </div>
    </div>
</div>

            <header style="margin-bottom:30px; display:flex; justify-content:space-between; align-items:center;">
                <div><h1 class="titular">Messages</h1><div style="color:var(--text-muted)">Accès réservé aux membres connectés. Ne partage pas de données sensibles.</div></div>
                <div class="nav-badge" style="background:var(--success); color:#000; font-weight:800; padding:5px 15px; border-radius:20px;"><i class="ri-wifi-line"></i> ONLINE</div>
            </header>

            <div class="chat-interface">
                <div class="contact-panel">
                    <div class="cp-header"><div class="search-bar"><i class="ri-search-line"></i><input type="text" id="contact-search" placeholder="Filtrer les canaux..."></div></div>
                    <div class="friend-code-add">
                        <input type="text" id="chat-friend-code" placeholder="TN-AB12CD" autocomplete="off">
                        <button type="button" onclick="addFriendByCodeFromChat()" title="Ajouter par matricule"><i class="ri-user-add-line"></i></button>
                    </div>
                    <div class="contact-list" id="contact-list"></div>
                </div>

                <div class="chat-area">
                    <div class="chat-header" id="chat-header" style="display:none;">
                        <div class="ch-user">
                            <div class="c-avatar" style="width:40px; height:40px;"><div class="c-img" id="header-avatar"></div><div class="c-status status-online" id="header-status-dot"></div></div>
                            <div><div class="ch-name" id="header-name">NOM</div><div class="ch-status" id="header-status-text"><i class="ri-loader-4-line"></i> En ligne</div></div>
                        </div>
                        <div class="ch-actions">
                            <button title="Signaler / Bloquer" onclick="openReportModal()"><i class="ri-error-warning-line"></i></button>
                        </div>
                    </div>

                    <div class="chat-feed" id="chat-feed">
                        <div class="empty-chat">
                            <i class="ri-message-3-line empty-icon"></i>
                            <h2 style="font-family:'Russo One'; color:#fff;">Aucun message pour le moment</h2>
                            <p>Selectionnez un canal pour commencer l'echange.</p>
                        </div>
                    </div>

                    <div class="chat-input-zone" id="chat-input-zone" style="display:none;">
                        <div class="c-input-wrapper">
                            <textarea id="msg-input" class="c-input" placeholder="Entrez votre message..." rows="1"></textarea>
                        </div>
                        <button class="c-btn-send" onclick="sendMessage()" aria-label="Envoyer le message" title="Envoyer"><i class="ri-send-plane-2-fill"></i></button>
                    </div>
                </div>
            </div>

            <div id="report-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:9999; align-items:center; justify-content:center; backdrop-filter:blur(5px);">
                <div class="card" style="max-width:350px; width:90%; text-align:center; border-color:var(--danger);">
                    <div style="font-size:3rem; color:var(--danger); margin-bottom:10px;"><i class="ri-alarm-warning-line"></i></div>
                    <h2 class="titular" style="margin-bottom:10px;">Gérer la conversation</h2>
                    <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:25px;">Que souhaitez-vous faire avec cet agent ?</p>

                    <div style="display:flex; flex-direction:column; gap:10px;">
                        <button class="btn" style="background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid var(--danger);" onclick="confirmReport()">
                            <i class="ri-flag-line"></i> SIGNALER (SPAM/INSULTE)
                        </button>
                        <button class="btn" style="background:rgba(255,255,255,0.05);" onclick="confirmBlock()">
                            <i class="ri-prohibited-line"></i> BLOQUER LE CONTACT
                        </button>
                        <button class="btn" style="margin-top:10px; background:transparent;" onclick="closeReportModal()">ANNULER</button>
                    </div>
                </div>
            </div>

        </main>
    </div>
