    <style>
        /* NAVIGATION */
        .trophy-nav { display: flex; gap: 10px; margin-bottom: 25px; }
        .nav-tab { 
            flex: 1; text-align: center; padding: 15px; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; cursor: pointer; color: var(--text-muted); 
            font-family: 'Russo One'; text-transform: uppercase; font-size: 0.9rem; transition: 0.2s; 
        }
        .nav-tab.active { background: var(--bg-panel); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }

        /* GRILLE SUCCES */
        .achievements-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }

        .ach-card { 
            border-radius: 16px; padding: 15px; 
            display: flex; align-items: center; gap: 20px; 
            position: relative; overflow: hidden; transition: 0.3s;
            border: 1px solid rgba(255,255,255,0.1);
            background: #1e293b;
        }

        /* ETAT DEBLOQUE */
        .ach-card.unlocked { 
            background: linear-gradient(145deg, rgba(16, 185, 129, 0.1), #06070A); 
            border-color: var(--success); 
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
        }
        .ach-card.unlocked .ach-main-icon {
            color: var(--success); filter: drop-shadow(0 0 5px var(--success)); transform: scale(1.1);
        }
        .ach-card.unlocked .lock-badge { display: none; }

        /* ICONE */
        .ach-icon-wrapper {
            width: 55px; height: 55px; flex-shrink: 0; position: relative;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,0.3); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);
        }
        .ach-main-icon { font-size: 1.8rem; color: #64748b; transition: 0.3s; }
        .lock-badge {
            position: absolute; top: -5px; left: -5px; 
            background: #06070A; border: 1px solid #334155;
            width: 20px; height: 20px; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; color: #94a3b8; font-size: 0.7rem; z-index: 2;
        }

        /* TEXTE */
        .ach-info { flex: 1; z-index: 2; }
        .ach-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; }
        .ach-title { font-size: 0.95rem; font-family: 'Russo One'; color: #fff; }

        /* Note: Style ach-reward conserv? au cas o?, mais non utilis? dans le HTML g?n?r? */
        .ach-reward { font-size: 0.7rem; color: var(--gold); font-weight: 800; background: rgba(126, 220, 255, 0.1); padding: 2px 6px; border-radius: 4px; border: 1px solid rgba(126, 220, 255, 0.2); }

        .ach-desc { font-size: 0.75rem; color: #94a3b8; line-height: 1.3; margin-bottom: 8px; }

        /* BARRE PROGRESSION */
        .ach-footer { display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: #64748b; font-family: 'Courier New'; font-weight: bold; }
        .ach-prog-bg { flex: 1; height: 6px; background: rgba(0,0,0,0.4); border-radius: 3px; overflow: hidden; }
        .ach-prog-fill { height: 100%; background: #38bdf8; width: 0%; transition: width 0.5s; }
        .ach-card.unlocked .ach-prog-fill { background: var(--success); }

        /* BOUTON D'ACTION (SOCIAL) */
        .btn-claim {
            background: var(--accent); color: #000; border: none; padding: 5px 12px; 
            border-radius: 4px; font-size: 0.7rem; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; margin-top: 5px; display: inline-block;
        }
        .btn-claim:hover { filter: brightness(1.1); }

        /* BESTIAIRE */
        .bestiary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .monster-card { background: #06070A; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; cursor: pointer; transition: 0.3s; position: relative; aspect-ratio: 1/1.2; display: flex; flex-direction: column; }
        .m-img-box { flex: 1; background-size: cover; background-position: top center; position: relative; filter: grayscale(1) contrast(1.2); }
        .monster-card.defeated .m-img-box { filter: none; }
        .monster-card.unknown .m-img-box { filter: brightness(0); background-color: #000; }
        .monster-card.unknown::after { content: "NO SIGNAL"; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: 'Courier New'; color: rgba(255,255,255,0.1); font-weight: bold; font-size: 0.8rem; letter-spacing: 2px; background: repeating-linear-gradient(45deg, transparent, transparent 5px, rgba(0,0,0,0.2) 5px, rgba(0,0,0,0.2) 10px); }
        .m-content { padding: 10px; background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .m-name { font-family: 'Russo One'; font-size: 0.8rem; color: #fff; margin-bottom: 2px; text-transform: uppercase; }
        .m-status { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        .status-killed { color: #000; background: var(--success); } .status-alive { color: #000; background: var(--danger); animation: pulse 2s infinite; } .status-locked { color: var(--text-muted); border: 1px solid var(--text-muted); }

        /* MODAL */
        .lore-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 10000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); padding: 20px; }
        .lore-card { background: #1e2538; width: 100%; max-width: 400px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.2); overflow: hidden; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popUp 0.3s ease-out; }
        .lore-header { height: 250px; position: relative; }
        .lore-full-img { width: 100%; height: 100%; object-fit: cover; object-position: top center; }
        .lore-grad { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 50%, #1e2538); }
        .lore-body { padding: 20px; text-align: center; margin-top: -20px; position: relative; z-index: 2; }
        .lore-badge { position: absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.8); padding: 5px 10px; border-radius: 4px; color: #fff; font-weight: 800; font-family: 'Courier New'; font-size: 0.7rem; border: 1px solid rgba(255,255,255,0.2); }
        @keyframes popUp { from{transform:translateY(20px);opacity:0;} to{transform:translateY(0);opacity:1;} }
        @keyframes pulse { 0%{opacity:1;} 50%{opacity:0.6;} 100%{opacity:1;} }
    </style>

    <script>
        // CONFIGURATION DES LIENS SOCIAUX
        const SOCIAL_LINKS = {
            'social_discord': 'https://discord.gg/exemple',
            'social_insta': 'https://instagram.com/titan_os',
            'social_tiktok': 'https://tiktok.com/@titan_os',
            'share_app': 'https://titan-os.netlify.app'
        };

        function trophySafeText(value, maxLength = 180) {
            const cleaned = window.titanSafeText
                ? window.titanSafeText(value, maxLength)
                : String(value ?? '').replace(/[\u0000-\u001F\u007F]/g, '').slice(0, maxLength);
            return window.titanEscapeText
                ? window.titanEscapeText(cleaned)
                : String(cleaned).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function trophySafeImagePath(value, fallback = './image/logo.png') {
            const path = String(value || '');
            return /^\.\/image\/(boss|mob)\/[A-Za-z0-9_.-]+$/.test(path) || path === './image/logo.png'
                ? path
                : fallback;
        }

        function trophyLocalEnemyImage(prefix, value, fallbackId = null) {
            const match = String(value || '').match(new RegExp(`${prefix}_(\\d+)`, 'i'));
            const imageId = match ? Number(match[1]) : Number(fallbackId);
            if (!Number.isInteger(imageId) || imageId < 1) return './image/logo.png';
            return trophySafeImagePath(`./image/${prefix}/${prefix}_${imageId}.webp`);
        }

        function trophySafeCount(value) {
            const count = parseInt(value, 10);
            return Number.isFinite(count) ? Math.max(1, Math.min(count, 9999)) : 1;
        }

        function trophySafeIcon(value, fallback = 'ri-medal-line') {
            const icon = String(value || '').trim();
            return /^ri-[a-z0-9-]+$/i.test(icon) ? icon : fallback;
        }

        document.addEventListener('DOMContentLoaded', () => {
            // FIX: Attente active des donnees (Robustesse V34)
            const initCheck = setInterval(() => {
                // On verifie que le STATE, le USER et la DB SUCCES sont l?
                if (window.state && window.state.user && typeof ACHIEVEMENTS_DB !== 'undefined') {
                    clearInterval(initCheck);

                    // Mise ? jour header (Niveau/Credits)
                    if(typeof updateGlobalUI === 'function') updateGlobalUI();

                    // Calcul et affichage
                    const stats = calculateAdvancedStats();
                    renderAchievements(stats);
                    renderBestiary();
                }
            }, 100);

            // Securite : arret si rien apr?s 5s
            setTimeout(() => clearInterval(initCheck), 5000);
        });

        function switchTab(view, btn) {
            document.getElementById('view-achievements').style.display = 'none';
            document.getElementById('view-bestiary').style.display = 'none';
            document.getElementById('view-' + view).style.display = 'block';
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            btn.classList.add('active');
        }

        // --- CALCUL INTELLIGENT DES STATS ---
        function calculateAdvancedStats() {
            // Securite si l'user ou l'historique n'est pas pr?t
            const u = window.state.user || {};
            const h = window.state.history || [];

            let s = {
                boss_kill: (window.state.game ? (window.state.game.bossLevel || 1) - 1 : 0),
                level: u.level || 1,
                credits: u.credits || 0, 

                sessions: h.length,
                xp: u.xp || 0,

                dist: 0,
                night: 0,
                morning: 0,
                sunday: 0,
                uniqueSports: new Set(),
                maxCal: 0,
                streak: u.streak_count || 0
            };

            h.forEach(log => {
                if(log.unit === 'km') s.dist += (parseFloat(log.val) || 0);

                const d = new Date(log.date);
                const hour = d.getHours();
                const day = d.getDay();

                if(hour >= 23 || hour < 4) s.night++;
                if(hour >= 5 && hour < 8) s.morning++;
                if(day === 0) s.sunday++;

                s.uniqueSports.add(log.sport);

                let cal = (log.xp || 0) * 0.8;
                if(cal > s.maxCal) s.maxCal = cal;
            });

            s.uniqueSportsCount = s.uniqueSports.size;
            return s;
        }

        // --- MAPPING DES SUCCES ---
        function getAchievementProgress(achId, stats) {
            if(achId.startsWith('kill_')) return stats.boss_kill;
            if(achId.startsWith('lvl_')) return stats.level;
            if(achId.startsWith('rich_')) return stats.credits;

            if(achId.startsWith('run_')) return stats.dist;
            if(achId.startsWith('sessions_')) return stats.sessions;
            if(achId.startsWith('xp_')) return stats.xp;

            if(achId === 'night_owl') return stats.night;
            if(achId === 'early_bird') return stats.morning;
            if(achId === 'weekend_warrior') return stats.sunday;
            if(achId.startsWith('streak_')) return stats.streak;
            if(achId.startsWith('multi_sport_')) return stats.uniqueSportsCount;
            if(achId.startsWith('burn_')) return stats.maxCal;

            if(achId.startsWith('social_') || achId === 'share_app') {
                return localStorage.getItem('ach_done_' + achId) ? 1 : 0;
            }
            if(achId === 'support_elite') {
                return window.state.user && window.state.user.is_elite ? 1 : 0;
            }

            return 0; 
        }

        function renderAchievements(stats) {
            const container = document.getElementById('ach-container');
            if (typeof ACHIEVEMENTS_DB === 'undefined' || ACHIEVEMENTS_DB.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding:30px;">Aucun succes charge.</div>`;
                return;
            }

            container.innerHTML = "";
            let unlockedCount = 0;

            ACHIEVEMENTS_DB.forEach(ach => {
                const current = getAchievementProgress(ach.id, stats);
                const target = Math.max(1, Number(ach.target) || 1);
                const isUnlocked = current >= target;
                if(isUnlocked) unlockedCount++;

                const pct = Math.min((current / target) * 100, 100);
                const safeId = String(ach.id || '').replace(/[^a-z0-9_-]/gi, '').slice(0, 80);
                const safeTitle = trophySafeText(ach.title || 'Succes', 80);
                const safeDesc = trophySafeText(ach.desc || 'Objectif sportif.', 180);
                const safeIcon = trophySafeIcon(ach.icon);

                let actionBtn = '';
                if(safeId && !isUnlocked && (safeId.startsWith('social_') || safeId === 'share_app')) {
                    actionBtn = `<button class="btn-claim" onclick="triggerSocial('${safeId}')"><i class="ri-external-link-line"></i> ACTION</button>`;
                }

                // NOTE: Suppression de la div "ach-reward" ici comme demand?
                container.innerHTML += `
                <div class="ach-card ${isUnlocked ? 'unlocked' : 'locked'}">
                    <div class="ach-icon-wrapper">
                        <div class="lock-badge"><i class="ri-lock-fill"></i></div>
                        <i class="${safeIcon} ach-main-icon"></i>
                    </div>
                    <div class="ach-info">
                        <div class="ach-header">
                            <div class="ach-title">${safeTitle}</div>
                        </div>
                        <div class="ach-desc">${safeDesc}</div>
                        ${actionBtn}
                        <div class="ach-footer">
                            <div style="width:70px;">${isUnlocked ? 'VALIDE' : Math.floor(current) + ' / ' + target}</div>
                            <div class="ach-prog-bg">
                                <div class="ach-prog-fill" style="width:${pct}%"></div>
                            </div>
                            <div style="width:35px; text-align:right;">${Math.floor(pct)}%</div>
                        </div>
                    </div>
                </div>`;
            });

            const totalPct = Math.floor((unlockedCount / ACHIEVEMENTS_DB.length) * 100);
            document.getElementById('total-completion').innerText = totalPct + "%";
            document.getElementById('total-count').innerText = `${unlockedCount} / ${ACHIEVEMENTS_DB.length}`;
            document.getElementById('total-bar').style.width = totalPct + "%";
        }

        function triggerSocial(id) {
            const url = SOCIAL_LINKS[id];
            if(url) window.open(url, '_blank');
            localStorage.setItem('ach_done_' + id, 'true');
            setTimeout(() => {
                const stats = calculateAdvancedStats();
                renderAchievements(stats);
                if(window.showNotification) window.showNotification('success', 'SUCCES', 'Succes valide !'); else console.warn('[SUCCES] Valide.');
            }, 1000);
        }

        // --- BESTIAIRE ---
        function renderBestiary() {
            const container = document.getElementById('monster-container');
            container.innerHTML = "";
            // Protection si game n'est pas charge
            const currentBossLvl = (window.state.game && window.state.game.bossLevel) ? window.state.game.bossLevel : 1;

            if (typeof BOSS_DB !== 'undefined') {
                BOSS_DB.forEach((boss, index) => {
                    const bossLvl = index + 1; 
                    let statusClass = "unknown";
                    let statusText = "VERROUILLE";
                    if (bossLvl < currentBossLvl) { statusClass = "defeated"; statusText = "ELIMINE"; } 
                    else if (bossLvl === currentBossLvl) { statusClass = "alive"; statusText = "CIBLE ACTIVE"; } 
                    const imgPath = trophyLocalEnemyImage('boss', boss.img, bossLvl);
                    const bossName = statusClass === 'unknown' ? '???' : trophySafeText(boss.name, 80);
                    container.innerHTML += `<div class="monster-card ${statusClass}" onclick="openLore(${index}, '${statusClass}')"><div class="m-img-box" style="background-image:url('${imgPath}')"></div><div class="m-content"><div class="m-name">${bossName}</div><div class="m-status status-${statusClass === 'defeated' ? 'killed' : (statusClass === 'alive' ? 'alive' : 'locked')}">${statusText}</div></div></div>`;
                });
            }
            const localBestiary = window.state.game?.bestiary || {};
            Object.values(localBestiary)
                .filter(entry => entry.type === 'BOSS')
                .sort((a, b) => (a.campaignLevel || 0) - (b.campaignLevel || 0))
                .forEach(entry => {
                    const imgPath = trophyLocalEnemyImage('boss', entry.imgOverride, entry.imageId);
                    const bossName = trophySafeText(entry.name || 'Boss archive', 80);
                    const cardTitle = trophySafeText(entry.card?.title || entry.title || 'Carte unique', 80);
                    const weak = trophySafeText(window.titanWeaknessLabel ? window.titanWeaknessLabel(entry.weakness) : (entry.weakness || 'N/A'), 60);
                    const mechanic = trophySafeText(entry.mechanic?.label || 'Mecanique archivee', 80);
                    const sport = trophySafeText(window.SPORTS_CONFIG?.[entry.decidingSport]?.label || entry.decidingSport || 'Sport inconnu', 80);
                    container.innerHTML += `<div class="monster-card defeated titan-boss-card" data-name="${bossName}" data-card="${cardTitle}" data-weak="${weak}" data-mechanic="${mechanic}" data-sport="${sport}"><div class="m-img-box" style="background-image:url('${imgPath}')"></div><div class="m-content"><div class="m-name">${bossName}</div><div class="m-status status-killed">${cardTitle}</div></div></div>`;
                });
            Object.values(localBestiary)
                .filter(entry => entry.type === 'MOB')
                .sort((a, b) => (b.defeats || 0) - (a.defeats || 0))
                .forEach(entry => {
                    const imgPath = trophyLocalEnemyImage('mob', entry.imgOverride, entry.imageId);
                    const rarity = trophySafeText(entry.rarity?.label || 'STANDARD', 40);
                    const weak = trophySafeText(window.titanWeaknessLabel ? window.titanWeaknessLabel(entry.weakness) : (entry.weakness || 'N/A'), 60);
                    const defeats = trophySafeCount(entry.defeats);
                    const mobName = trophySafeText(entry.name || 'Entite inconnue', 80);
                    container.innerHTML += `<div class="monster-card defeated titan-mob-card" data-rarity="${rarity}" data-weak="${weak}" data-defeats="${defeats}"><div class="m-img-box" style="background-image:url('${imgPath}')"></div><div class="m-content"><div class="m-name">${mobName}</div><div class="m-status status-killed">${rarity} // x${defeats}</div></div></div>`;
                });

            container.querySelectorAll('.titan-mob-card').forEach(card => {
                card.addEventListener('click', () => {
                    const summary = `TYPE: ${card.dataset.rarity || 'STANDARD'} | FAIBLESSE: ${card.dataset.weak || 'N/A'} | NEUTRALISATIONS: ${card.dataset.defeats || '1'}`;
                    if(window.showNotification) window.showNotification('info', 'BESTIAIRE', summary);
                    else console.warn('[BESTIAIRE]', summary);
                });
            });

            container.querySelectorAll('.titan-boss-card').forEach(card => {
                card.addEventListener('click', () => {
                    const summary = `${card.dataset.card || 'Carte unique'} | FAIBLESSE: ${card.dataset.weak || 'N/A'} | MECANIQUE: ${card.dataset.mechanic || 'N/A'} | SPORT DECISIF: ${card.dataset.sport || 'N/A'}`;
                    if(window.showNotification) window.showNotification('info', card.dataset.name || 'BOSS ARCHIVE', summary);
                    else console.warn('[BESTIAIRE]', summary);
                });
            });
        }

        function openLore(index, status) {
            if(status === 'unknown') return window.showNotification ? window.showNotification('warning', 'ACCES REFUSE', 'Donnees cryptees.') : console.warn('[BESTIAIRE] Acces refuse.');
            const boss = BOSS_DB[index];
            const modal = document.getElementById('lore-modal');
            document.getElementById('lore-name').innerText = boss.name;
            document.getElementById('lore-lvl').innerText = index + 1;
            document.getElementById('lore-desc').innerText = boss.desc || "Pas de description.";
            document.getElementById('lore-hp').innerText = (boss.baseHp + (index*1000)).toLocaleString();
            document.getElementById('lore-weak').innerText = boss.weak || "N/A";
            const loreImage = document.getElementById('lore-img-src');
            loreImage.src = trophyLocalEnemyImage('boss', boss.img, index + 1);
            loreImage.alt = `Dossier du boss ${boss.name}`;
            const statusBadge = document.getElementById('lore-status');
            if(status === 'defeated') { statusBadge.innerText = "NEUTRALISE"; statusBadge.style.color = "var(--success)"; statusBadge.style.borderColor = "var(--success)"; } 
            else { statusBadge.innerText = "CIBLE PRIORITAIRE"; statusBadge.style.color = "var(--danger)"; statusBadge.style.borderColor = "var(--danger)"; }
            modal.style.display = 'flex';
        }
        function closeLore() { document.getElementById('lore-modal').style.display = 'none'; }
    </script>
