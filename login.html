    <style>
        /* STYLES SPECIFIQUES LOGIN */
        body {
            background-color: #06070A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Outfit', sans-serif;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.1) 0%, transparent 50%),
                linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
        }

        .login-card {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(56, 189, 248, 0.3);
            backdrop-filter: blur(12px);
            padding: 40px 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        /* Effet Scan Laser */
        .login-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: #38bdf8;
            box-shadow: 0 0 15px #38bdf8;
            animation: scan 3s infinite linear;
            opacity: 0.7;
        }
        @keyframes scan { 0% {top:0;} 50% {top:100%; opacity:0;} 100% {top:0;} }

        .logo-area { margin-bottom: 25px; }
        .logo-img { width: 80px; height: 80px; margin-bottom: 10px; filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.6)); }
        .app-title { font-family: 'Russo One', sans-serif; font-size: 2rem; color: #fff; letter-spacing: 2px; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); margin: 0; }
        .app-subtitle { color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 3px; margin-top: 5px; }

        .form-group { margin-bottom: 20px; text-align: left; }
        .input-label { display: block; font-size: 0.7rem; color: #38bdf8; margin-bottom: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .input-field {
            width: 100%; padding: 14px; 
            background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px; color: #fff; font-family: 'Outfit', sans-serif; font-size: 1rem;
            transition: 0.3s; box-sizing: border-box;
        }
        .input-field:focus { outline: none; border-color: #38bdf8; background: rgba(15, 23, 42, 0.9); box-shadow: 0 0 15px rgba(56, 189, 248, 0.2); }

        .btn-main {
            width: 100%; padding: 15px;
            background: #38bdf8; color: #06070A;
            border: none; border-radius: 8px;
            font-family: 'Russo One', sans-serif; font-size: 1rem;
            cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.2s; margin-top: 10px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-main:hover { background: #fff; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); transform: translateY(-2px); }

        .btn-guest {
            width: 100%; padding: 12px;
            background: transparent; color: #64748b;
            border: 1px dashed rgba(255,255,255,0.2); border-radius: 8px;
            font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; margin-top: 25px; transition: 0.2s;
        }
        .btn-guest:hover { color: #fff; border-color: #fff; }

        .divider { margin: 25px 0; display: flex; align-items: center; gap: 15px; color: #475569; font-size: 0.7rem; text-transform: uppercase; }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,0.1); }

        .switch-mode { margin-top: 20px; color: #94a3b8; font-size: 0.9rem; cursor: pointer; text-decoration: underline; }
        .switch-mode:hover { color: #38bdf8; }

        .forgot-pass { text-align: right; margin-top: -10px; margin-bottom: 20px; font-size: 0.8rem; color: #64748b; cursor: pointer; }
        .forgot-pass:hover { color: #fff; text-decoration: underline; }

        #error-msg, #success-msg {
            font-size: 0.85rem; margin-top: 15px; padding: 10px; border-radius: 8px; display: none; text-align: left;
        }
        #error-msg { color: #ef4444; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); }
        #success-msg { color: #4ade80; background: rgba(74, 222, 128, 0.1); border: 1px solid rgba(74, 222, 128, 0.2); }
    </style>

<body data-page="login">

    <main class="login-card">
        <div class="logo-area">
            <img src="./image/logo.png" class="logo-img" alt="Logo Titan" width="80" height="80" decoding="async">
            <h1 class="app-title">TITAN OS</h1>
            <div class="app-subtitle">Connexion securisee</div>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label class="input-label" for="email">Identifiant (Email)</label>
                <input type="email" id="email" class="input-field" placeholder="agent@titan-os.com" required>
            </div>

            <div class="form-group" id="confirm-email-group" style="display:none;">
                <label class="input-label" for="confirm-email">Confirmation Identifiant</label>
                <input type="email" id="confirm-email" class="input-field" placeholder="Repetez l'email">
            </div>

            <div class="form-group" id="pseudo-group" style="display:none;">
                <label class="input-label" for="pseudo">Pseudo public</label>
                <input type="text" id="pseudo" class="input-field" minlength="2" maxlength="24" placeholder="Ex: TitanRunner" aria-label="Pseudo public">
            </div>

            <div class="form-group">
                <label class="input-label" for="password">Code d'acces</label>
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
            </div>

            <div class="forgot-pass" id="forgot-link" onclick="resetPassword()">Mot de passe oublie ?</div>

            <button type="submit" class="btn-main" id="submit-btn">
                <i class="ri-fingerprint-line"></i> CONNEXION
            </button>

            <div id="error-msg"></div>
            <div id="success-msg"></div>
        </form>

        <div class="switch-mode" onclick="toggleMode()" id="toggle-text">
            Pas de dossier ? Creer un profil
        </div>

        <div class="divider">OU ACCES RESTREINT</div>

        <button class="btn-guest" onclick="enterGuestMode()">
            <i class="ri-eye-line"></i> MODE OBSERVATEUR (INVITE)
        </button>
    </main>

    <script>
        // --- 1. CONFIGURATION DU SYSTEME ---
        const LOGIN_SUPABASE_URL = window.TITAN_SUPABASE_URL;
        const LOGIN_SUPABASE_KEY = window.TITAN_SUPABASE_ANON_KEY;

        // IMPORTANT : On force l'URL du vrai site pour les liens emails
        const SITE_URL = 'https://titan-app.fr'; 

        let client = null;
        let isLoginMode = true;

        function getSupabaseClient() {
            if (client) return client;
            if (typeof window.initTitanSupabaseClient === 'function') {
                client = window.initTitanSupabaseClient();
                if (client) return client;
            }
            if (!window.supabase || typeof window.supabase.createClient !== 'function') return null;
            client = window.supabase.createClient(LOGIN_SUPABASE_URL, LOGIN_SUPABASE_KEY, window.TITAN_SUPABASE_CLIENT_OPTIONS);
            return client;
        }

        window.addEventListener('load', getSupabaseClient);

        // --- 2. GESTION CONNEXION / INSCRIPTION ---
        async function handleAuth(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmEmail = document.getElementById('confirm-email').value.trim();
            const pseudo = sanitizePseudo(document.getElementById('pseudo').value);
            const btn = document.getElementById('submit-btn');
            const errorBox = document.getElementById('error-msg');
            const successBox = document.getElementById('success-msg');

            // Animation chargement
            btn.innerHTML = `<i class="ri-loader-4-line"></i> TRAITEMENT...`;
            btn.style.opacity = "0.7";
            errorBox.style.display = "none";
            successBox.style.display = "none";

            try {
                if (isLoginMode) {
                    // --- MODE LOGIN ---
                    const authClient = getSupabaseClient();
                    if (!authClient) throw new Error("Serveur d'authentification indisponible. Verifiez votre connexion puis reessayez.");

                    const { data, error } = await authClient.auth.signInWithPassword({ email, password });
                    if (error) throw error;

                    window.location.href = getSafeNextUrl();
                } else {
                    // --- MODE INSCRIPTION ---
                    if (email !== confirmEmail) throw new Error("Les emails ne correspondent pas.");
                    if (pseudo.length < 2) throw new Error("Choisissez un pseudo public de 2 caracteres minimum.");

                    const authClient = getSupabaseClient();
                    if (!authClient) throw new Error("Serveur d'authentification indisponible. Verifiez votre connexion puis reessayez.");

                    const { data, error } = await authClient.auth.signUp({
                        email,
                        password,
                        options: {
                            // On force la redirection vers le site EN LIGNE apres clic mail
                            emailRedirectTo: SITE_URL + '/index.html',
                            data: { full_name: pseudo, username: pseudo }
                        }
                    });

                    if (error) throw error;
                    if (data && data.session && data.user) {
                        await ensureSignupProfile(authClient, data.user.id, pseudo);
                    }
                    successBox.innerHTML = `Dossier cree !<br><strong>Verifiez vos emails</strong> pour activer l'acces.`;
                    successBox.style.display = "block";
                }
            } catch (err) {
                console.error(err);
                let msg = err.message;
                if(msg.includes("Invalid login")) msg = "Identifiants inconnus.";
                if(msg.includes("already registered")) msg = "Cet agent existe deja.";
                errorBox.innerText = "Erreur : " + msg;
                errorBox.style.display = "block";
            } finally {
                btn.innerHTML = isLoginMode ? `<i class="ri-fingerprint-line"></i> CONNEXION` : `<i class="ri-user-add-line"></i> Créer mon compte`;
                btn.style.opacity = "1";
            }
        }

        function sanitizePseudo(value) {
            return String(value || '')
                .replace(/[<>]/g, '')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, 24);
        }

        function getSafeNextUrl() {
            const params = new URLSearchParams(window.location.search);
            const requested = params.get('next');
            if (!requested) return 'aujourdhui.html';

            try {
                const target = new URL(requested, window.location.href);
                if (target.origin !== window.location.origin) return 'aujourdhui.html';
                if (target.pathname.endsWith('/admin')) target.pathname = target.pathname + '.html';
                return target.href;
            } catch (error) {
                return 'aujourdhui.html';
            }
        }

        async function ensureSignupProfile(authClient, userId, pseudo) {
            try {
                await authClient.from('profiles').upsert({
                    id: userId,
                    username: pseudo,
                    game_state: {},
                    credits: 200,
                    level: 1,
                    is_elite: false,
                    is_tester: false,
                    streak_count: 0,
                    friend_code: null,
                    inventory: { g_rusty: 3 }
                }, { onConflict: 'id' });
                if (typeof authClient.rpc === 'function') await authClient.rpc('titan_assign_friend_code');
            } catch (error) {
                console.warn("Creation profil differee:", error);
            }
        }

        // --- 3. GESTION MOT DE PASSE OUBLIE (C'EST ICI LE CORRECTIF) ---
        async function resetPassword() {
            const email = document.getElementById('email').value.trim();
            const errorBox = document.getElementById('error-msg');
            const successBox = document.getElementById('success-msg');

            if (!email) {
                errorBox.innerText = "Saisissez votre email dans le champ Identifiant d'abord.";
                errorBox.style.display = "block";
                return;
            }

            if(confirm(`Envoyer le lien de secours ? : ${email} ?`)) {
                try {
                    // ON ENVOIE LE MAIL AVEC LE BON LIEN DE REDIRECTION
                    const authClient = getSupabaseClient();
                    if (!authClient) throw new Error("Serveur d'authentification indisponible. Verifiez votre connexion puis reessayez.");

                    const { error } = await authClient.auth.resetPasswordForEmail(email, {
                        // C'est cette ligne qui fait que ca marche
                        redirectTo: SITE_URL + '/update-password.html' 
                    });

                    if (error) throw error;

                    successBox.innerText = "Lien envoye ! Verifiez votre boite mail (et les spams).";
                    successBox.style.display = "block";
                    errorBox.style.display = "none";
                } catch (err) {
                    errorBox.innerText = "Erreur systeme : " + err.message;
                    errorBox.style.display = "block";
                }
            }
        }

        // --- 4. UI: BASCULE LOGIN <-> INSCRIPTION ---
        function toggleMode() {
            isLoginMode = !isLoginMode;
            const title = document.querySelector('.app-subtitle');
            const btn = document.getElementById('submit-btn');
            const toggleText = document.getElementById('toggle-text');
            const confirmGroup = document.getElementById('confirm-email-group');
            const pseudoInput = document.getElementById('pseudo');
            const pseudoGroup = document.getElementById('pseudo-group');
            const forgotLink = document.getElementById('forgot-link');

            document.getElementById('error-msg').style.display = "none";
            document.getElementById('success-msg').style.display = "none";

            if (isLoginMode) {
                title.innerText = "Connexion securisee";
                btn.innerHTML = `<i class="ri-fingerprint-line"></i> CONNEXION`;
                toggleText.innerText = "Pas de dossier ? Creer un profil";
                confirmGroup.style.display = "none";
                pseudoGroup.style.display = "none";
                pseudoInput.required = false;
                forgotLink.style.display = "block";
            } else {
                title.innerText = "Créer mon profil";
                btn.innerHTML = `<i class="ri-user-add-line"></i> Créer mon compte`;
                toggleText.innerText = "Deja un compte ? Se connecter";
                confirmGroup.style.display = "block";
                pseudoGroup.style.display = "block";
                pseudoInput.required = true;
                forgotLink.style.display = "none";
            }
        }

        function enterGuestMode() {
            if(confirm("Attention : votre progression ne sera pas sauvegardee en ligne. Continuer ?")) {
                localStorage.removeItem('titan_os_v12_save');
                const authClient = getSupabaseClient();
                if (authClient) {
                    authClient.auth.signOut().finally(() => window.location.href = 'aujourdhui.html');
                } else {
                    window.location.href = 'aujourdhui.html';
                }
            }
        }
    </script>
