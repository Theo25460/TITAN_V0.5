<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>TITAN: PROFIL</title>
    <link rel="icon" type="image/png" href="./images/logo.png">
    
    <link rel="stylesheet" href="./css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* LAYOUT PRINCIPAL */
        .rpg-layout { 
            display: grid; 
            grid-template-columns: 350px 380px 1fr; 
            gap: 25px; 
            height: calc(100vh - 140px); 
            min-height: 650px; 
        }

        /* STYLE DES PANNEAUX */
        .panel { 
            background: var(--bg-panel); 
            border-radius: 24px; 
            border: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            position: relative;
        }
        .panel-header {
            padding: 15px 20px;
            background: rgba(0,0,0,0.4);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-family: 'Russo One';
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: var(--text-muted);
            text-transform: uppercase;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        .panel-content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            scrollbar-width: none; 
        }
        .panel-content::-webkit-scrollbar { display: none; }

        /* 1. IDENTITÉ (GAUCHE) */
        .avatar-section { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; background: rgba(255,255,255,0.03); padding: 15px; border-radius: 16px; }
        .avatar-circle-lg {
            width: 70px; height: 70px; border-radius: 50%; 
            background: #10141e; border: 2px solid var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: var(--accent);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }
        .id-text h2 { font-size: 1.2rem; margin: 0; line-height: 1.2; color: #fff; }
        .id-text .lvl-badge { background: var(--primary); color: #000; font-weight: 800; font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; display: inline-block; margin-top: 5px; }

        /* RADAR CHART */
        .radar-box {
            background: #0f131c; border-radius: 20px; padding: 15px;
            border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; position: relative;
        }
        .radar-title { position: absolute; top: 15px; left: 15px; font-size: 0.7rem; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; }
        .radar-wrapper { position: relative; height: 260px; width: 100%; margin-top: 10px; }

        /* BIO INPUTS */
        .bio-container { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; }
        .bio-row { display: flex; gap: 15px; margin-bottom: 15px; }
        .bio-input-group { flex: 1; position: relative; }
        .bio-input-group label { display: block; font-size: 0.7rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 800; text-transform: uppercase; }
        .input-bio {
            width: 100%; background: #131824; border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 10px; border-radius: 8px; font-family: 'Russo One'; font-size: 0.9rem;
            transition: 0.2s; text-align: center;
        }
        .input-bio:focus { border-color: var(--primary); background: #0f131c; }

        /* 2. DOLL (CENTRE) - Retour à la version stable */
        .doll-area { position: relative; background: radial-gradient(circle at center, #1e2538 0%, #10141e 80%); }
        
        /* IMAGE DE FOND (SILHOUETTE) */
        .body-silhouette { 
            position: absolute; 
            top: 55%; /* Centrage vertical */
            left: 50%; 
            transform: translate(-50%, -50%); 
            width: 100%; 
            height: 90%; 
            background-image: url('./images/inventaire.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
            opacity: 0.5;
            pointer-events: none; 
            z-index: 0;
        }

        /* CASES (SLOTS) - Taille d'origine */
        .gear-slot { 
            width: 68px; height: 68px; 
            background: rgba(19, 24, 36, 0.6); 
            border: 2px solid rgba(255,255,255,0.1); border-radius: 14px; 
            position: absolute; display: flex; align-items: center; justify-content: center; 
            cursor: pointer; transition: 0.2s; color: rgba(255,255,255,0.3); font-size: 1.6rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3); backdrop-filter: blur(4px);
            z-index: 10;
        }
        .gear-slot:hover { border-color: #fff; color: #fff; transform: scale(1.1); z-index: 50; background: rgba(255,255,255,0.1); }
        
        /* --- POSITIONNEMENT DES SLOTS --- */
        
        /* Tête : Tout en haut */
        .pos-head { top: 8%; left: 50%; transform: translateX(-50%); } 
        
        /* Torse : Sur la poitrine */
        .pos-chest { top: 28%; left: 50%; transform: translateX(-50%); } 
        
        /* Gants : Au niveau de la taille/mains */
        .pos-hands { top: 46%; left: 50%; transform: translateX(-50%); }

        /* Jambières : Genoux */
        .pos-legs { top: 62%; left: 50%; transform: translateX(-50%); } 
        
        /* Bottes : Chevilles */
        .pos-feet { top: 82%; left: 50%; transform: translateX(-50%); } 
        
        /* Arme (Main Droite) : Écartée gauche */
        .pos-mainhand { top: 35%; left: 12%; } 
        
        /* Bouclier (Main Gauche) : Écartée droite */
        .pos-offhand { top: 35%; right: 12%; } 

        .stat-summary { position: absolute; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; gap: 10px; z-index: 20; }
        .stat-badge { background: #0f131c; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 6px; }

        /* 3. INVENTAIRE (DROITE) */
        .inv-filters { 
            display: flex; gap: 8px; padding: 15px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            flex-shrink: 0; 
        }
        .filter-tag { font-size: 0.75rem; padding: 6px 12px; border-radius: 20px; background: rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; color: var(--text-muted); font-weight: 700; }
        .filter-tag.active { background: var(--primary); color: #000; }
        
        .inv-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); 
            gap: 10px; 
            padding: 15px; 
            overflow-y: auto; 
            flex: 1; 
            min-height: 0; 
            align-content: start;
        }
        
        .inv-item { aspect-ratio: 1; background: #131824; border-radius: 12px; border: 2px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.5rem; color: var(--text-muted); position: relative; transition: 0.2s; }
        .inv-item:hover { background: #1e2538; border-color: #fff; color: #fff; transform: translateY(-2px); }
        
        .rare-1 { border-color: #475569; }
        .rare-2 { border-color: #0ea5e9; box-shadow: 0 0 10px rgba(14, 165, 233, 0.1); color: #0ea5e9; }
        .rare-3 { border-color: #eab308; box-shadow: 0 0 15px rgba(234, 179, 8, 0.15); color: #eab308; animation: pulseGold 3s infinite; }
        @keyframes pulseGold { 0%,100%{box-shadow: 0 0 10px rgba(234,179,8,0.2);} 50%{box-shadow: 0 0 25px rgba(234,179,8,0.5);} }

        /* Recycle */
        .recycle-mode .inv-item { border-color: #ef4444 !important; opacity: 0.7; }
        .recycle-mode .inv-item:hover { opacity: 1; background: rgba(239,68,68,0.1); }
        .recycle-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.2s; }
        .recycle-btn.active { background: var(--danger); color: #fff; border-color: var(--danger); box-shadow: 0 0 15px rgba(239,68,68,0.4); }

        /* LOOT MODAL */
        .loot-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; perspective: 1000px; }
        .loot-overlay.active { opacity: 1; pointer-events: all; }
        .loot-stage { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .crate-container { text-align: center; animation: dropBox 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .crate-icon { font-size: 12rem; color: var(--gold); filter: drop-shadow(0 0 50px rgba(250, 204, 21, 0.3)); }
        .shaking { animation: violentShake 0.5s ease-in-out infinite; }
        .flash-bang { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; }
        .flash-active { animation: flashAnim 0.8s ease-out forwards; }
        .godrays { position: absolute; top: 50%; left: 50%; width: 800px; height: 800px; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,0.05) 0deg 10deg, transparent 10deg 20deg); transform: translate(-50%, -50%); border-radius: 50%; z-index: 5; animation: spinRays 20s linear infinite; display: none; opacity: 0.5; }
        .item-reveal-card { display: none; background: #1e2538; border-radius: 24px; padding: 50px; text-align: center; width: 90%; max-width: 400px; border: 2px solid rgba(255,255,255,0.1); position: relative; z-index: 10; box-shadow: 0 0 100px rgba(0,0,0,0.8); animation: popItem 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes dropBox { from { transform: translateY(-100vh) scale(0.5); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes violentShake { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-5px, 5px) rotate(-5deg); } 50% { transform: translate(5px, -5px) rotate(5deg); } 75% { transform: translate(-5px, -5px) rotate(-5deg); } 100% { transform: translate(0,0) rotate(0); } }
        @keyframes flashAnim { 0% { opacity: 0; } 20% { opacity: 1; } 100% { opacity: 0; } }
        @keyframes popItem { from { transform: scale(0) translateY(50px); opacity: 0; } to { transform: scale(1) translateY(0); opacity: 1; } }
        @keyframes spinRays { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
    </style>
</head>
<body>
    <div class="layout">
        <nav class="sidebar"></nav>

        <main class="main-content">
            <div id="mobile-header-placeholder"></div>

            <div class="rpg-layout">
                
                <div class="panel">
                    <div class="panel-header">BASE DE DONNÉES JOUEUR</div>
                    <div class="panel-content">
                        <div class="avatar-section">
                            <div class="avatar-circle-lg"><i class="ri-user-3-fill"></i></div>
                            <div class="id-text">
                                <h2 id="id-name">JOUEUR</h2>
                                
                                <div style="display:flex; align-items:center; gap:10px; margin:5px 0;">
                                    <span style="font-family:'Outfit'; color:var(--accent); font-weight:800; font-size:0.9rem; letter-spacing:1px; background:rgba(56, 189, 248, 0.1); padding:2px 8px; border-radius:4px; border:1px solid rgba(56, 189, 248, 0.2); cursor:pointer;" onclick="copyFriendCode()" title="Copier le matricule">
                                        ID: <span id="id-code">TN-????</span> <i class="ri-file-copy-line" style="font-size:0.8rem;"></i>
                                    </span>
                                </div>

                                <div class="lvl-badge">NIVEAU <span id="id-lvl">1</span></div>
                            </div>
                        </div>

                        <div class="radar-box">
                            <div class="radar-title">ANALYSE TACTIQUE</div>
                            <div class="radar-wrapper">
                                <canvas id="statsRadar"></canvas>
                            </div>
                        </div>

                        <div class="bio-container">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                                <div style="font-weight:800; color:#fff; font-size:0.8rem; letter-spacing:1px;">
                                    <i class="ri-heart-pulse-line" style="color:var(--primary);"></i> BIO-MÉTRIE
                                </div>
                                <button class="recycle-btn" onclick="saveBio()" style="border-color:var(--success); color:var(--success); font-weight:bold;">
                                    <i class="ri-save-3-line"></i> SAUVER
                                </button>
                            </div>
                            <div class="bio-row">
                                <div class="bio-input-group">
                                    <label>POIDS (kg)</label>
                                    <input type="number" id="in-weight" class="input-bio" placeholder="0">
                                </div>
                                <div class="bio-input-group">
                                    <label>TAILLE (cm)</label>
                                    <input type="number" id="in-height" class="input-bio" placeholder="0">
                                </div>
                            </div>
                            <div class="bio-input-group">
                                <label>ÂGE (Années)</label>
                                <input type="number" id="in-age" class="input-bio" placeholder="0">
                            </div>
                        </div>

                        <div style="margin-top:25px;" id="account-actions"></div>
                    </div>
                </div>

                <div class="panel doll-area">
                    <div class="panel-header" style="background:transparent; border:none; position:absolute; top:0; left:0; width:100%; z-index:20;">ARMURE ACTIVE</div>
                    
                    <div class="body-silhouette"></div>
                    
                    <div class="gear-slot pos-head" id="slot-head" onclick="unequip('head')"><i class="ri-add-line"></i></div>
                    <div class="gear-slot pos-chest" id="slot-chest" onclick="unequip('chest')"><i class="ri-add-line"></i></div>
                    <div class="gear-slot pos-mainhand" id="slot-mainhand" onclick="unequip('mainhand')"><i class="ri-add-line"></i></div>
                    <div class="gear-slot pos-offhand" id="slot-offhand" onclick="unequip('offhand')"><i class="ri-add-line"></i></div>
                    <div class="gear-slot pos-hands" id="slot-hands" onclick="unequip('hands')"><i class="ri-add-line"></i></div>
                    <div class="gear-slot pos-legs" id="slot-legs" onclick="unequip('legs')"><i class="ri-add-line"></i></div>
                    <div class="gear-slot pos-feet" id="slot-feet" onclick="unequip('feet')"><i class="ri-add-line"></i></div>

                    <div class="stat-summary">
                        <div class="stat-badge" style="color:#ef4444; border-color:#ef4444;"><i class="ri-sword-fill"></i> <span id="tot-str">0</span></div>
                        <div class="stat-badge" style="color:#38bdf8; border-color:#38bdf8;"><i class="ri-flashlight-fill"></i> <span id="tot-agi">0</span></div>
                        <div class="stat-badge" style="color:#4ade80; border-color:#4ade80;"><i class="ri-shield-cross-fill"></i> <span id="tot-end">0</span></div>
                        <div class="stat-badge" style="color:#a855f7; border-color:#a855f7;"><i class="ri-brain-fill"></i> <span id="tot-mind">0</span></div>
                    </div>
                </div>

                <div class="panel" id="inv-panel">
                    <div class="panel-header">
                        <div style="display:flex; align-items:center; gap:8px; color:var(--gold);">
                            <i class="ri-copper-coin-fill" style="font-size:1.2rem;"></i> 
                            <span style="font-size:1.1rem; font-weight:800;" id="global-credits">0</span>
                        </div>
                        <button class="recycle-btn" id="recycle-btn" onclick="toggleRecycleMode()"><i class="ri-recycle-line"></i> RECYCLER</button>
                    </div>
                    <div class="inv-filters">
                        <div class="filter-tag active" onclick="filterInv('all', this)">TOUT</div>
                        <div class="filter-tag" onclick="filterInv('equip', this)">ÉQUIPEMENT</div>
                        <div class="filter-tag" onclick="filterInv('rare', this)">RARE+</div>
                    </div>
                    
                    <div class="inv-grid" id="inventory-container">
                        </div>
                    
                    <div style="margin-top:auto; padding:20px; border-top:1px solid rgba(255,255,255,0.05); background:rgba(0,0,0,0.2); flex-shrink:0;">
                        <button class="btn btn-action" style="width:100%; justify-content:space-between; padding:15px 20px;" onclick="buyLootBox()">
                            <div style="display:flex; align-items:center; gap:10px;"><i class="ri-treasure-map-line" style="font-size:1.2rem;"></i> COFFRE MYSTÈRE</div>
                            <div style="font-size:0.9rem; opacity:0.8;">200 $</div>
                        </button>
                    </div>
                </div>

            </div>

            <div id="loot-modal" class="loot-overlay">
                <div class="flash-bang" id="flash-bang"></div>
                <div class="loot-stage">
                    <div id="crate-view" class="crate-container"><i class="ri-archive-drawer-fill crate-icon" id="crate-anim"></i><h2 style="margin-top:20px; color:#fff;">OUVERTURE...</h2></div>
                    <div class="godrays" id="godrays"></div>
                    <div id="item-view" class="item-reveal-card">
                        <div style="font-weight:800; letter-spacing:2px; margin-bottom:15px; color:var(--text-muted);">ITEM OBTENU</div>
                        <div id="reveal-icon" style="font-size:5rem; margin-bottom:20px; color:#fff;"></div>
                        <h1 id="reveal-name" class="titular" style="font-size:1.8rem; margin-bottom:5px;">NOM</h1>
                        <div id="reveal-rarity" style="font-weight:800; color:var(--gold); margin-bottom:20px;">RARETÉ</div>
                        <div style="background:rgba(255,255,255,0.05); padding:10px; border-radius:10px; font-weight:bold; color:var(--accent); margin-bottom:10px;"><span id="reveal-stats">+0 BONUS</span></div>
                        <div style="font-size:0.8rem; color:var(--text-muted); font-style:italic; margin-bottom:20px;" id="reveal-desc">...</div>
                        <button class="btn btn-action" style="width:100%;" onclick="location.reload()">AJOUTER À L'INVENTAIRE</button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script src="./js/items.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/main.js"></script>
    <script>
        let isRecycleMode = false; let currentFilter = 'all'; let radarChart = null;

        document.addEventListener('DOMContentLoaded', () => {
            if(!state) return;
            
            // Remplissage des infos profil
            document.getElementById('id-name').innerText = state.user.name;
            document.getElementById('id-lvl').innerText = state.user.level;
            document.getElementById('id-code').innerText = state.user.friendCode || "TN-ERR";
            
            if(state.user.bio) {
                document.getElementById('in-weight').value = state.user.bio.weight;
                document.getElementById('in-height').value = state.user.bio.height;
                document.getElementById('in-age').value = state.user.bio.age;
            }

            renderAccountModule();
            
            // Rendu des graphiques et inventaire
            const stats = calculateTotalStats();
            renderRadar(stats);
            renderDoll();
            renderInventory();
        });

        // --- GESTION DU COMPTE (MODIFIÉ) ---

        function renderAccountModule() {
            const div = document.getElementById('account-actions');
            
            // 1. Changement de mot de passe
            let passwordHtml = `
                <div style="background:rgba(255,255,255,0.03); padding:15px; border-radius:12px; border:1px solid rgba(255,255,255,0.05); margin-bottom:20px;">
                    <div style="font-weight:800; color:#fff; font-size:0.8rem; margin-bottom:10px;">SÉCURITÉ</div>
                    <div style="display:flex; gap:10px;">
                        <input type="password" id="new-password" class="input-bio" placeholder="Nouveau mot de passe" style="text-align:left;">
                        <button class="recycle-btn" onclick="updateUserPassword()" style="border-color:var(--primary); color:var(--primary);">
                            <i class="ri-save-2-line"></i>
                        </button>
                    </div>
                </div>
            `;

            // 2. Zone de Danger et Déconnexion
            let actionsHtml = `
                <button class="btn" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); width:100%; font-size:0.8rem; margin-bottom:15px;" onclick="logout()">
                    <i class="ri-logout-box-r-line"></i> DÉCONNEXION
                </button>
                
                <div style="border-top:1px dashed rgba(239,68,68,0.3); padding-top:20px; margin-top:10px;">
                    <div style="font-size:0.7rem; color:var(--danger); font-weight:800; margin-bottom:10px; text-transform:uppercase;">ZONE DE DANGER</div>
                    
                    <button class="btn" style="background:rgba(239,68,68,0.1); color:var(--danger); border:1px solid var(--danger); width:100%; font-size:0.75rem; margin-bottom:10px;" onclick="hardResetSystem()">
                        <i class="ri-alarm-warning-line"></i> RESET LOCAL (CACHE)
                    </button>
                    
                    <button class="btn" style="background:transparent; color:#ef4444; border:1px solid #7f1d1d; width:100%; font-size:0.75rem; opacity:0.7;" onclick="deleteAccountDefinitively()">
                        <i class="ri-skull-line"></i> SUPPRIMER MON COMPTE
                    </button>
                </div>
            `;

            if(state.user.isGuest) {
                div.innerHTML = `
                    <div style="background:rgba(234,179,8,0.1); border:1px solid var(--gold); padding:15px; border-radius:12px; color:var(--gold); font-size:0.8rem; text-align:center; margin-bottom:20px;">
                        <i class="ri-alert-line"></i> COMPTE INVITÉ
                    </div>
                    <button class="btn btn-action" onclick="window.location.href='login.html'" style="width:100%; font-size:0.9rem; margin-bottom:15px;">CRÉER UN COMPTE</button>
                    <button class="btn" style="background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); width:100%; font-size:0.8rem;" onclick="logout()">
                        <i class="ri-logout-box-r-line"></i> QUITTER
                    </button>
                `;
            } else {
                div.innerHTML = passwordHtml + actionsHtml;
            }
        }

        async function deleteAccountDefinitively() {
            // 1. Avertissement
            if(!confirm("⚠️ ATTENTION : ACTION IRRÉVERSIBLE !\n\nVoulez-vous vraiment supprimer définitivement votre compte Titan OS ?\n\nToutes vos données (XP, Inventaire, Historique) seront effacées de la base de données.")) return;

            // 2. Double sécurité
            const confirmation = prompt("Pour confirmer la suppression, tapez 'DELETE' en majuscules ci-dessous :");
            if(confirmation !== 'DELETE') {
                return alert("Suppression annulée. Le code de confirmation est incorrect.");
            }

            // 3. Appel Supabase
            if(supabase) {
                try {
                    const { error } = await supabase.rpc('delete_own_account');
                    if(error) throw error;
                    
                    alert("Compte supprimé avec succès. Fin de mission, Soldat.");
                    localStorage.removeItem('titan_os_v5_final'); // Nettoyage local
                    window.location.href = 'login.html';
                } catch (err) {
                    console.error(err);
                    alert("Erreur lors de la suppression : " + err.message);
                }
            } else {
                alert("Impossible de joindre le serveur.");
            }
        }

        async function updateUserPassword() {
            const newPassword = document.getElementById('new-password').value;
            if (!newPassword || newPassword.length < 6) return alert("Le mot de passe doit faire au moins 6 caractères.");
            try {
                const { error } = await supabase.auth.updateUser({ password: newPassword });
                if (error) throw error;
                alert("✅ Mot de passe mis à jour !");
                document.getElementById('new-password').value = "";
            } catch (err) { alert("Erreur : " + err.message); }
        }

        function hardResetSystem() {
            if(confirm("Effacer les données locales et redémarrer ?")) {
                localStorage.clear();
                window.location.reload();
            }
        }

        // --- FONCTIONS UTILITAIRES ---
        function copyFriendCode() {
            const code = state.user.friendCode;
            if(code) {
                navigator.clipboard.writeText(code).then(() => alert("Matricule copié !"));
            }
        }

        function saveBio() {
            state.user.bio.weight = parseFloat(document.getElementById('in-weight').value) || 0;
            state.user.bio.height = parseFloat(document.getElementById('in-height').value) || 0;
            state.user.bio.age = parseFloat(document.getElementById('in-age').value) || 0;
            saveState();
            alert("Données biométriques enregistrées.");
        }

        // --- LOGIQUE D'AFFICHAGE (Doll, Radar, Inventaire) ---
        function calculateTotalStats() {
            let b = { strength: state.stats.strength || 0, agility: state.stats.agility || 0, mind: state.stats.mind || 0, endurance: state.stats.endurance || 0 };
            Object.values(state.equipped).forEach(id => { if(id) { const item = ITEM_DB.find(i => i.id === id); if(item && b[item.stat] !== undefined) b[item.stat] += item.val; } });
            document.getElementById('tot-str').innerText = b.strength; document.getElementById('tot-agi').innerText = b.agility; document.getElementById('tot-end').innerText = b.endurance; document.getElementById('tot-mind').innerText = b.mind;
            return b;
        }

        function renderRadar(stats) {
            if(radarChart) radarChart.destroy();
            const ctx = document.getElementById('statsRadar').getContext('2d');
            const norm = { str: stats.strength/10, agi: stats.agility/10, mind: stats.mind/10, end: stats.endurance/10 }; // Scale arbitraire pour affichage
            
            radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['FORCE', 'AGILITÉ', 'MENTAL', 'DÉFENSE'],
                    datasets: [{
                        label: 'Stats',
                        data: [norm.str, norm.agi, norm.mind, norm.end],
                        backgroundColor: 'rgba(56, 189, 248, 0.4)',
                        borderColor: '#38bdf8',
                        pointBackgroundColor: '#fff',
                        borderWidth: 2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        r: {
                            min: 0, max: 100, // Ajuster selon ta courbe de progression
                            ticks: { display: false },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#fff', font: { family: 'Russo One' } }
                        }
                    }
                }
            });
        }

        function filterInv(type, btn) { currentFilter = type; document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderInventory(); }
        function toggleRecycleMode() { isRecycleMode = !isRecycleMode; const btn = document.getElementById('recycle-btn'); const panel = document.getElementById('inv-panel'); if(isRecycleMode) { btn.classList.add('active'); panel.classList.add('recycle-mode'); } else { btn.classList.remove('active'); panel.classList.remove('recycle-mode'); } }
        
        function renderInventory() {
            const container = document.getElementById('inventory-container'); container.innerHTML = "";
            if(state.inventory.length === 0) { container.innerHTML = "<div style='grid-column:1/-1; text-align:center; color:var(--text-muted); padding:20px; font-size:0.8rem;'>Inventaire vide.</div>"; return; }
            state.inventory.forEach(id => {
                const item = ITEM_DB.find(i => i.id === id); if(!item) return;
                if(Object.values(state.equipped).includes(id)) return;
                if(currentFilter === 'equip' && item.rare < 2) return; if(currentFilter === 'rare' && item.rare < 2) return;
                const el = document.createElement('div'); el.className = `inv-item rare-${item.rare}`; el.innerHTML = `<i class="${item.icon}"></i>`; 
                el.onclick = () => { if(isRecycleMode) sellItem(id); else equipItem(id); };
                container.appendChild(el);
            });
        }
        
        function renderDoll() { for(const[slot,id] of Object.entries(state.equipped)) { const el = document.getElementById(`slot-${slot}`); if(el) { if(id) { const item = ITEM_DB.find(i => i.id === id); if(item) { el.innerHTML = `<i class="${item.icon}"></i>`; el.className = `gear-slot pos-${slot} rare-${item.rare}`; el.style.borderColor = item.rare===3?"var(--gold)":(item.rare===2?"var(--accent)":"#fff"); el.style.background = "rgba(255,255,255,0.1)"; el.style.color = "#fff"; } } else { el.className = `gear-slot pos-${slot}`; el.innerHTML = `<i class="ri-add-line" style="opacity:0.2"></i>`; el.style = ""; } } } }
        
        function buyLootBox() {
             // Redirection vers main.js via global
             if(typeof window.buyLootBox === 'function') window.buyLootBox();
             else alert("Fonction lootbox introuvable.");
        }
    </script>
</body>
</html>
