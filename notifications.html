    <style>
        .notice-grid { display:grid; gap:14px; }
        .notice-card {
            display:grid; grid-template-columns:42px minmax(0, 1fr); gap:14px; align-items:start;
            padding:16px; border:1px solid rgba(148,163,184,0.14); border-radius:8px;
            background:rgba(30,41,59,0.45);
        }
        .notice-icon {
            width:42px; height:42px; display:grid; place-items:center; border-radius:10px;
            background:rgba(56,189,248,0.12); color:#38bdf8; font-size:1.25rem;
        }
        .notice-title { font-family:'Russo One'; color:#fff; font-size:0.95rem; margin-bottom:5px; }
        .notice-text { color:#94a3b8; font-size:0.86rem; line-height:1.5; overflow-wrap:anywhere; }
        .notice-meta { color:#64748b; font-size:0.72rem; margin-top:8px; font-family:'Courier New', monospace; }
        .notice-inline { display:flex; flex-wrap:wrap; gap:7px; margin-top:10px; }
        .notice-inline span { border:1px solid rgba(255,255,255,0.09); background:rgba(255,255,255,0.045); border-radius:6px; padding:5px 7px; color:#cbd5e1; font-size:0.68rem; font-weight:800; }
        .notice-actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
        .notice-actions button, .notice-actions a {
            min-height:42px; padding:0 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.12);
            background:rgba(255,255,255,0.06); color:#e2e8f0; font-weight:900; text-decoration:none; cursor:pointer;
        }
        .notice-actions button.primary { background:#38bdf8; border-color:#38bdf8; color:#020617; }
    </style>

    <style data-titan-critical-boot>
      html { background:#0f172a; color-scheme:dark; }
      body { margin:0; background:#0f172a; color:#f8fafc; }
      html.titan-booting::before {
        content:""; position:fixed; inset:0; z-index:2147482990; pointer-events:none;
        background:radial-gradient(circle at 50% 42%, rgba(56,189,248,.13), transparent 18rem), #050914;
      }
      html.titan-booting::after {
        content:"TITAN"; position:fixed; left:50%; top:50%; z-index:2147482991;
        transform:translate(-50%,-50%); color:#f8fafc; font:800 14px Arial,sans-serif;
        letter-spacing:.22em; text-transform:uppercase;
      }
      html.titan-booting .layout,
      html.titan-booting .legal-layout { opacity:0; }
      html.titan-ready .layout,
      html.titan-ready .legal-layout { opacity:1; }
    </style>
    <script data-titan-critical-boot>
      document.documentElement.classList.add('titan-booting');
      window.addEventListener('load', function () {
        setTimeout(function () {
          if (typeof window.titanHideBoot === 'function') return;
          document.documentElement.classList.remove('titan-booting');
          document.documentElement.classList.add('titan-ready');
        }, 160);
      });
      setTimeout(function () {
        if (typeof window.titanHideBoot === 'function') return;
        document.documentElement.classList.remove('titan-booting');
        document.documentElement.classList.add('titan-ready');
      }, 1400);
    </script>

<body data-page="notifications">

                <button type="button" onclick="retryPendingSync()"><i class="ri-refresh-line"></i> Réessayer l’enregistrement</button>
                <a href="./changelog.html"><i class="ri-history-line"></i> Nouveautés</a>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => setTimeout(hydrateNotificationCenter, 500));

        function noticeCard(icon, title, text, meta = '') {
            return `
                <article class="notice-card">
                    <div class="notice-icon"><i class="${icon}"></i></div>
                    <div>
                        <div class="notice-title">${window.titanEscapeText(title)}</div>
                        <div class="notice-text">${window.titanEscapeText(text)}</div>
                        ${meta ? `<div class="notice-meta">${window.titanEscapeText(meta)}</div>` : ''}
                    </div>
                </article>`;
        }

        function renderNotificationCenter() {
            const grid = document.getElementById('notice-grid');
            const pending = typeof window.titanGetPendingTrainingLogs === 'function' ? window.titanGetPendingTrainingLogs() : [];
            const readiness = typeof window.titanBuildCloudReadiness === 'function' ? window.titanBuildCloudReadiness() : null;
            const snapshot = readiness?.snapshot || null;
            const lastSession = window.state?.user?.lastSessionSummary || null;
            const cards = [];

            if (snapshot) {
                const ageMin = readiness?.snapshotAgeMs ? Math.max(0, Math.round(readiness.snapshotAgeMs / 60000)) : 0;
                cards.push(noticeCard(
                    'ri-shield-star-line',
                    'Ta progression est sauvegardée',
                    `Niveau ${snapshot.level ?? '--'} · ${snapshot.xp ?? 0} XP · ${snapshot.credits ?? 0} crédits · ${snapshot.training_30d ?? 0} séance(s) sur 30 jours.`,
                    `Mise à jour il y a ${ageMin} min`
                ));
            } else {
                cards.push(noticeCard(
                    readiness?.connectedUser ? 'ri-cloud-off-line' : 'ri-hard-drive-2-line',
                    readiness?.connectedUser ? 'Sauvegarde temporairement indisponible' : 'Progression sur cet appareil',
                    readiness?.connectedUser ? 'Ta progression n’est pas disponible pour le moment. Réessaie dans quelques instants.' : 'Sans compte connecté, la progression reste uniquement sur cet appareil.',
                    readiness?.connectedUser ? 'Tes données locales sont conservées.' : 'Connecte un compte pour la retrouver sur plusieurs appareils.'
                ));
            }

            if (lastSession) {
                const gains = `+${lastSession.xp || 0} XP · +${lastSession.credits || 0} crédits`;
                const readout = [
                    lastSession.loot,
                    lastSession.selfDuel,
                    lastSession.cooldown,
                    lastSession.plateau,
                    lastSession.nextObjective
                ].filter(Boolean).join(' // ');
                cards.push(noticeCard(
                    'ri-flashlight-line',
                    `Derniere seance: ${lastSession.sport || 'sport'}`,
                    `${gains}${readout ? `. ${readout}` : ''}`,
                    lastSession.date || ''
                ));
                if ((lastSession.contextualRecords || []).length || (lastSession.regularityBadges || []).length) {
                    cards.push(noticeCard(
                        'ri-trophy-line',
                        'Signaux personnels',
                        [...(lastSession.contextualRecords || []), ...(lastSession.regularityBadges || [])].slice(0, 4).join(' // '),
                        'Records contextualises et regularite'
                    ));
                }
            }

            cards.push(noticeCard(
                pending.length ? 'ri-time-line' : 'ri-checkbox-circle-line',
                pending.length ? 'Séances à enregistrer' : 'Tout est à jour',
                pending.length ? `${pending.length} séance(s) seront enregistrées dès que la connexion le permettra.` : 'Toutes tes séances sont enregistrées.',
                pending[0]?.queuedAt ? `Première attente : ${pending[0].queuedAt}` : ''
            ));

            cards.push(noticeCard(
                'ri-sparkling-line',
                'Nouveautés TITAN',
                'Les dernières améliorations et informations importantes restent accessibles depuis l’accueil.',
                'Consulter la page Nouveautés pour le détail.'
            ));

            grid.innerHTML = cards.join('');
        }

        async function hydrateNotificationCenter() {
            renderNotificationCenter();
            if (typeof window.titanRefreshProgressionSnapshot === 'function') {
                await window.titanRefreshProgressionSnapshot({ silent: true });
            }
            renderNotificationCenter();
        }

        async function refreshCloudSnapshot() {
            if (typeof window.titanRefreshProgressionSnapshot === 'function') {
                await window.titanRefreshProgressionSnapshot();
            }
            renderNotificationCenter();
        }

        async function retryPendingSync() {
            if (typeof window.flushPendingTrainingLogs === 'function') await window.flushPendingTrainingLogs();
            if (typeof window.titanRefreshProgressionSnapshot === 'function') await window.titanRefreshProgressionSnapshot({ silent: true });
            renderNotificationCenter();
        }
    </script>
