<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta
      name="description"
      content="Ton suivi sportif : séances, durée, régularité et tendances par sport."
    />
    <link rel="canonical" href="https://titan-app.fr/stats" />
    <title>Progrès sportifs — TITAN</title>
    <meta name="robots" content="noindex,nofollow" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b121b" />
    <link rel="stylesheet" href="./css/style.css?v=102.0" />
    <link rel="stylesheet" href="/css/icons.css?v=102.0" />
    <link rel="stylesheet" href="./css/design-system.css?v=102.0" />
    <link rel="stylesheet" href="./css/tracking.css?v=102.0" />
  </head>
  <body data-page="stats">
    <div class="layout">
      <nav class="sidebar" aria-label="Navigation principale"></nav>
      <main class="main-content" id="contenu-principal">
        <div class="mobile-user-bar"></div>
        <header class="tracking-header">
          <div>
            <div class="tracking-eyebrow">Chaque séance compte</div>
            <h1>Ta progression.</h1>
            <p>Moins de chiffres inutiles. Plus de recul sur ta pratique.</p>
          </div>
          <a class="tracking-action" href="/training"
            ><i class="ri-add-line" aria-hidden="true"></i> Enregistrer</a
          >
        </header>
        <div class="tracking-toolbar">
          <label
            >Période<select id="progress-period">
              <option value="7">7 jours</option>
              <option value="30" selected>30 jours</option>
              <option value="90">90 jours</option>
              <option value="365">Un an</option>
            </select></label
          ><label
            >Sport<select id="progress-sport">
              <option value="all">Tous les sports</option>
            </select></label
          >
        </div>
        <div class="tracking-toolbar">
          <button
            type="button"
            class="tracking-secondary"
            id="export-journal-csv"
          >
            Exporter le journal CSV</button
          ><a class="tracking-secondary" href="/bilan"
            >Mon bilan et les analyses TITAN+ ↗</a
          >
        </div>
        <div id="progress-content" aria-live="polite"></div>
        <div id="pending-panel"></div>
        <p class="tracking-status" id="progress-status">
          Chargement de tes séances…
        </p>
      </main>
    </div>
    <script src="/js/vendor/supabase-2.111.0.js"></script>
    <script src="./js/titan-v100.js?v=102.0" defer></script>
    <script src="./js/config.js?v=102.0"></script>
    <script src="./js/data.js?v=102.0"></script>
    <script src="./js/ui.js?v=102.0"></script>
    <script src="./js/training-store.js?v=102.0"></script>
    <script src="./js/state.js?v=102.0"></script>
    <script src="./js/titan_features.js?v=102.0"></script>
    <script src="./js/main.js?v=102.0"></script>
    <script src="./js/session-export.js?v=102.0"></script>
    <script src="./js/progress-page.js?v=102.0"></script>
    <script src="./js/pending-ui.js?v=102.0"></script>
    <script src="./js/pwa.js?v=102.0" defer></script>
  </body>
</html>
