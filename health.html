    <style>
        /* --- STYLES SPECIFIQUES --- */
        .bio-container { display: grid; gap: 20px; grid-template-columns: 1fr; }

        .score-card {
            background: linear-gradient(145deg, #1e2538, #131824);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 30px; position: relative; overflow: hidden; text-align: center;
            border: 1px solid rgba(255,255,255,0.05); border-radius: 24px;
        }

        .circular-chart { display: block; margin: 0 auto; max-width: 80%; max-height: 200px; }
        .circle-bg { fill: none; stroke: rgba(255,255,255,0.05); stroke-width: 2.5; }
        .circle { 
            fill: none; stroke-width: 2.5; stroke-linecap: round; stroke: var(--success);
            transition: stroke-dasharray 1s ease, stroke 0.3s;
        }
        .percentage { 
            fill: #fff; font-family: 'Russo One', sans-serif; font-weight: bold; 
            font-size: 8px; text-anchor: middle; dominant-baseline: central;
        }
        .label-score { 
            fill: var(--text-muted); font-family: 'Outfit', sans-serif; font-size: 4px; 
            text-anchor: middle; text-transform: uppercase; letter-spacing: 0.5px; 
        }

        .signal-log { margin-top: 16px; display: grid; gap: 8px; width: 100%; max-width: 360px; }
        .signal-log-item { border: 1px solid rgba(148,163,184,0.16); border-radius: 8px; background: rgba(255,255,255,0.035); padding: 10px; color: #cbd5e1; font-size: 0.76rem; line-height: 1.35; }
        .signal-log-item strong { display: block; color: #fff; text-transform: uppercase; font-size: 0.68rem; margin-bottom: 4px; }

        .control-panel { display: flex; flex-direction: column; gap: 15px; }
        .input-row {
            background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.05);
            padding: 15px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between;
        }
        .input-icon {
            width: 40px; height: 40px; background: rgba(0,0,0,0.3); border-radius: 8px;
            display: flex; align-items: center; justify-content: center; color: var(--accent); margin-right: 15px;
        }
        .input-data { flex: 1; }
        .input-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; display: block; margin-bottom: 5px; }
        .hidden-input { background: transparent; border: none; color: #fff; font-family: 'Russo One'; font-size: 1.2rem; width: 100%; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin-top: 5px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; margin-top: -6px; }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 2px; }

        .btn-scan {
            background: linear-gradient(90deg, var(--success), #22c55e); color: #000;
            font-family: 'Russo One'; text-transform: uppercase; padding: 18px; border-radius: 12px;
            border: none; width: 100%; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        @media (min-width: 768px) { .bio-container { grid-template-columns: 350px 1fr; } }
    </style>

    <script>
        // --- LOGIQUE DE SECOURS INTEGREE (Si main.js plante ou est en cache) ---

        function calculateLocalScore(inputs) {
            let score = 0;
            let sleepScore = Math.min(25, (inputs.sleep / 8) * 25); if (inputs.sleep < 5) sleepScore *= 0.5;
            let waterScore = Math.min(20, (inputs.water / 2.5) * 20);
            let stepScore = Math.min(20, (inputs.steps / 10000) * 20);
            let nutriScore = (inputs.nutrition / 5) * 20;
            let stressScore = 15 - ((inputs.stress / 5) * 15);
            score = Math.min(100, Math.max(0, sleepScore + waterScore + stepScore + nutriScore + stressScore));

            let multiplier = 1.0;
            if (score >= 90) multiplier = 1.2;
            else if (score >= 75) multiplier = 1.1;
            else if (score < 50) multiplier = 0.9;

            return { score: Math.round(score), multiplier };
        }

        function updateCircle(score) {
            const circle = document.getElementById('score-circle');
            const text = document.getElementById('score-text');
            text.textContent = score; // Force le texte
            circle.setAttribute('stroke-dasharray', `${score}, 100`);

            if(score >= 80) circle.style.stroke = 'var(--success)';
            else if(score >= 50) circle.style.stroke = 'var(--gold)';
            else circle.style.stroke = 'var(--danger)';
        }

        function getRecoveryAdvice(score, inputs = {}) {
            if (score >= 80) return "Fenetre propre: seance normale possible, garde une execution propre.";
            if (score >= 60) return "Charge correcte: privilegie une seance controlee ou technique.";
            if (score >= 40) return "Signal fragile: reduis l'intensite, ajoute echauffement et recuperation active.";
            return "Recuperation prioritaire: marche douce, mobilite, sommeil et hydratation avant intensite.";
        }

        function updateRecoveryAdvice(score, inputs = {}) {
            const advice = document.getElementById('recovery-advice');
            if (!advice) return;
            advice.textContent = getRecoveryAdvice(score, inputs);
            advice.style.color = score >= 80 ? 'var(--success)' : (score >= 50 ? 'var(--gold)' : 'var(--danger)');
        }

        function processScanLocal() {
            const inputs = {
                sleep: parseFloat(document.getElementById('inp-sleep').value) || 0,
                water: parseFloat(document.getElementById('inp-water').value) || 0,
                steps: parseInt(document.getElementById('inp-steps').value) || 0,
                nutrition: parseInt(document.getElementById('inp-nutri').value) || 0,
                stress: parseInt(document.getElementById('inp-stress').value) || 0
            };

            // On utilise la fonction locale pour ?tre sur que ca marche
            const result = calculateLocalScore(inputs);

            // Mise ? jour visuelle
            updateCircle(result.score);
            updateRecoveryAdvice(result.score, inputs);
            document.getElementById('xp-mult').innerText = "x" + result.multiplier;

            // Sauvegarde via main.js si dispo, sinon localStorage direct
            if(window.state && window.state.user) {
                window.state.user.dailyHealth = {
                    date: new Date().toISOString().split('T')[0],
                    score: result.score,
                    multiplier: result.multiplier,
                    ...inputs
                };
                if(!Array.isArray(window.state.user.recoveryCheckIns)) window.state.user.recoveryCheckIns = [];
                window.state.user.recoveryCheckIns.unshift({
                    date: new Date().toISOString(),
                    score: result.score,
                    sleep: inputs.sleep,
                    water: inputs.water,
                    steps: inputs.steps,
                    nutrition: inputs.nutrition,
                    stress: inputs.stress,
                    advice: getRecoveryAdvice(result.score, inputs)
                });
                window.state.user.recoveryCheckIns = window.state.user.recoveryCheckIns.slice(0, window.state.user.is_elite ? 90 : 21);
                // Essayer d'appeler saveState global
                if(typeof saveState === 'function') saveState();
                else localStorage.setItem('titan_os_v12_save', JSON.stringify(window.state));
            }

            renderSignalLog();
            if(window.showNotification) window.showNotification('success', 'ANALYSE TERMINEE', `Score: ${result.score}/100 | Bonus: x${result.multiplier}`);
            else console.warn(`[SANTE] Analyse terminee: ${result.score}/100, bonus x${result.multiplier}`);
        }

        function renderSignalLog() {
            const target = document.getElementById('signal-log');
            if(!target) return;
            const items = Array.isArray(window.state?.user?.recoveryCheckIns) ? window.state.user.recoveryCheckIns.slice(0, 4) : [];
            if(!items.length) {
                target.innerHTML = '<div class="signal-log-item"><strong>Carnet corporel</strong>Aucun check-in archive pour le moment.</div>';
                return;
            }
            target.innerHTML = items.map(item => `
                <div class="signal-log-item">
                    <strong>${window.titanEscapeText(String(item.date || '').slice(0, 10))} // ${Number(item.score || 0)}/100</strong>
                    ${window.titanEscapeText(item.advice || 'Signal archive.')}
                </div>
            `).join('');
        }

        // Chargement initial
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if(window.state && window.state.user && window.state.user.dailyHealth) {
                    const dh = window.state.user.dailyHealth;
                    if(dh.date === new Date().toISOString().split('T')[0]) {
                        document.getElementById('inp-sleep').value = dh.sleep || "";
                        document.getElementById('inp-water').value = dh.water || "";
                        document.getElementById('inp-steps').value = dh.steps || "";
                        updateCircle(dh.score);
                        updateRecoveryAdvice(dh.score, dh);
                        document.getElementById('xp-mult').innerText = "x" + dh.multiplier;
                    }
                }
                renderSignalLog();
            }, 500);
        });
    </script>
